 name: Tests
‘on’:
push: {}
pull_request: {}
workflow_dispatch: {}
permissions:
contents: read
jobs:
test:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-node@v4
with:
node-version: 22
- run: node –test tests/api.test.mjs
- run: node –test tests/dev-server.test.mjs
- run: node –test tests/smoke.test.mjs
