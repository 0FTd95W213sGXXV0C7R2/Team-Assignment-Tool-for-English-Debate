
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>チーム分け＆論題管理システム</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  font-family: system-ui, -apple-system, sans-serif;
  color: #1e293b;
  background: #f8fafc;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 12px 14px 40px; }
main { max-width: 920px; margin: auto; }
h1 { font-size: 1.5rem; color: #2563eb; }
h2 { font-size: 1.2rem; margin-top: 0; }
h3 { font-size: 1.05rem; color: #2563eb; }
.card {
  background: white;
  border-radius: 12px;
  padding: 20px;
  margin: 16px 0;
  box-shadow: 0 2px 10px #00000010;
}
.hidden { display: none !important; }
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
label { display: block; font-weight: 600; margin: 12px 0 5px; }
input, textarea, select {
  width: 100%;
  padding: 11px;
  font: inherit;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  background: white;
}
textarea { min-height: 120px; resize: vertical; }
input[type="checkbox"] { width: auto; }
button {
  background: #2563eb;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 11px 15px;
  min-height: 44px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
button:disabled { opacity: .5; }
.secondary { background: #64748b; }
.danger { background: #dc2626; }
.success { background: #16a34a; }
.small { font-size: .85rem; padding: 7px 11px; min-height: 36px; }
.full { width: 100%; }
.muted { font-size: .88rem; color: #64748b; }
.item {
  padding: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  margin: 9px 0;
  overflow-wrap: anywhere;
}
.item-actions { display: flex; gap: 7px; margin-top: 9px; }
.panel { background: #f1f5f9; padding: 14px; border-radius: 9px; }
.notice {
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  background: #dbeafe;
  white-space: pre-wrap;
}
.error { background: #fee2e2; color: #991b1b; }
.ok { background: #dcfce7; color: #166534; }
.scroll { max-height: 400px; overflow-y: auto; }
.match {
  padding: 14px;
  border-left: 4px solid #2563eb;
  background: #f1f5f9;
  margin: 12px 0;
  border-radius: 8px;
}
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #f8fafc;
  padding: 5px 0 10px;
}
.modal {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #0008;
  display: grid;
  place-items: center;
  padding: 16px;
}
.dialog {
  background: white;
  border-radius: 12px;
  padding: 20px;
  width: min(100%, 500px);
}
@media (max-width: 650px) {
  .grid { grid-template-columns: 1fr; }
  .card { padding: 15px; }
}
</style>
</head>
<body>
<main>
<header>
  <div class="row" style="justify-content:space-between">
    <h1>チーム分け＆論題管理システム</h1>
    <button id="back" class="secondary small hidden">← メニュー</button>
  </div>
  <div id="connection" class="muted">データベース接続確認中…</div>
</header>

<section id="home" class="card">
  <h2>メニュー</h2>
  <button id="goAssign" class="full">チーム分け ＆ 論題記録</button>
  <button id="goManage" class="secondary full" style="margin-top:12px">
    新規論題追加・管理
  </button>
</section>

<section id="assign" class="hidden">
  <div class="card">
    <h2>1. 論題の選択・実施記録</h2>
    <div class="row" style="justify-content:space-between">
      <span class="muted">ランダムに最大4件表示</span>
      <button id="shuffle" class="secondary small">シャッフル</button>
    </div>
    <div id="candidates"></div>

    <h3>論題を検索・絞り込み</h3>
    <input id="preSearch" type="search" placeholder="キーワード検索">
    <div class="grid">
      <select id="preTournament"><option value="">すべての大会</option></select>
      <select id="preYear"><option value="">すべての年度</option></select>
    </div>
    <select id="preStatus" style="margin-top:10px">
      <option value="all">すべての実施状況</option>
      <option value="done">直近1年に実施した論題</option>
      <option value="not_done">直近1年に未実施の論題</option>
    </select>
    <div id="preResults" class="scroll"></div>

    <div id="chosen" class="notice ok hidden">
      <div id="chosenText"></div>
      <button id="clearChosen" class="danger small" style="margin-top:8px">
        選択解除
      </button>
    </div>
  </div>

  <div class="card">
    <h2>2. メンバー・チーム設定</h2>
    <div class="grid">
      <div>
        <label for="participants">メンバー（1行に1人）</label>
        <textarea id="participants"></textarea>
      </div>
      <div>
        <label for="judges">事前指定ジャッジ</label>
        <textarea id="judges"></textarea>
      </div>
      <div>
        <label for="pairs">試合数</label>
        <select id="pairs"></select>
      </div>
      <div>
        <label for="teamSize">1チームの人数</label>
        <input id="teamSize" type="number" min="1" max="30" value="3">
      </div>
    </div>
    <p class="muted">
      定員を超えたメンバーはジャッジ候補になります。
    </p>
    <button id="generate" class="full">チームを割り振る</button>
    <div id="assignResult"></div>
  </div>
</section>

<section id="manage" class="hidden">
  <div class="card">
    <h2 id="formHeading">新規論題の追加</h2>

    <div id="motionForm">
      <label for="motion">論題 *</label>
      <input id="motion" placeholder="THW ...">

      <div class="grid">
        <div>
          <label for="tournament">大会名</label>
          <input id="tournament" placeholder="HPDU推奨">
        </div>
        <div>
          <label for="year">年度</label>
          <input id="year" placeholder="2026">
        </div>
      </div>

      <label>
        <input id="done" type="checkbox">
        過去に実施したことがある
      </label>

      <div id="doneDateBox" class="hidden">
        <label for="doneDate">実施日（不明なら2024-01-01）</label>
        <input id="doneDate" type="date">
      </div>

      <div class="row" style="margin-top:15px">
        <button id="preview">入力内容を確認する</button>
        <button id="cancelEdit" class="secondary hidden">
          編集をキャンセル
        </button>
      </div>
    </div>

    <div id="previewBox" class="panel hidden">
      <h3>登録内容の確認</h3>
      <div id="previewText"></div>
      <div class="row">
        <button id="revise" class="secondary">修正する</button>
        <button id="save" class="success">この内容で決定する</button>
      </div>
    </div>

    <div id="formStatus" class="notice hidden"></div>
  </div>

  <div class="card">
    <h2>登録済み論題一覧</h2>
    <input id="manageSearch" type="search" placeholder="キーワード検索">

    <div class="grid">
      <select id="manageTournament">
        <option value="">すべての大会</option>
      </select>
      <select id="manageYear">
        <option value="">すべての年度</option>
      </select>
    </div>

    <select id="manageStatus" style="margin-top:10px">
      <option value="all">すべての実施状況</option>
      <option value="done">直近1年に実施</option>
      <option value="not_done">直近1年に未実施</option>
    </select>

    <div class="row" style="margin-top:12px">
      <button id="addTournament" class="secondary small">
        大会選択肢を追加
      </button>
      <button id="export" class="secondary small">
        motions.jsonをダウンロード
      </button>
      <button id="reload" class="secondary small">
        再読み込み
      </button>
    </div>

    <div id="manageList" class="scroll"></div>
  </div>
</section>
</main>

<div id="confirmModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="dialog">
    <h2>論題実施の確認</h2>
    <p>次の論題を本日実施したものとして記録します。</p>
    <div id="confirmMotion" class="panel"></div>
    <div id="confirmError" class="notice error hidden"></div>
    <div class="row" style="margin-top:15px">
      <button id="closeModal" class="secondary">キャンセル</button>
      <button id="record" class="success">記録を確定する</button>
    </div>
  </div>
</div>

<script>
"use strict";

(() => {


  let adminToken = '';

  async function motionApi(action, id = null, row = null, revision = null) {
    if (!adminToken) {
      adminToken = prompt("開発版の管理者APIトークンを入力してください") || '';
    }
    if (!adminToken) throw new Error("管理者認証が必要です");

    const response = await fetch('/api/motion-write', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + adminToken
      },
      body: JSON.stringify({
        action,
        id,
        row,
        expectedRevision: revision
      })
    });

    const result = await response.json();

    if (!response.ok) {
      if (response.status === 401) adminToken = '';
      throw new Error(result.error || '書き込みに失敗しました');
    }

    return result;
  }

  async function recordMotionApi(id, revision) {
    const response = await fetch('/api/motion-record', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, expectedRevision: revision })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || '記録に失敗しました');
    }

    return result;
  }

  const $ = id => document.getElementById(id);

  const show = (id, visible) => {
    $(id).classList.toggle("hidden", !visible);
  };

  function element(tag, text, className = "") {
    const el = document.createElement(tag);
    if (text !== undefined) el.textContent = String(text);
    if (className) el.className = className;
    return el;
  }

  function makeButton(text, handler, className = "secondary small") {
    const btn = element("button", text, className);
    btn.type = "button";
    btn.addEventListener("click", handler);
    return btn;
  }

  function setMessage(id, text, type = "") {
    const el = $(id);
    el.textContent = text;
    el.className = "notice" + (type ? " " + type : "");
    show(id, Boolean(text));
  }

  let db = null;
  let motions = [];
  let selectedMotion = null;
  let pendingId = null;
  let editingId = null;
  let busy = false;
  let customTournaments = [];

  function historyOf(motion) {
    return Array.isArray(motion.history)
      ? motion.history.filter(v =>
          typeof v === "string" && !Number.isNaN(Date.parse(v))
        )
      : [];
  }

  function recentHistory(motion) {
    const cutoff = new Date();
    cutoff.setFullYear(cutoff.getFullYear() - 1);
    const now = new Date();

    return historyOf(motion).filter(v => {
      const date = new Date(v);
      return date >= cutoff && date <= now;
    });
  }

  function normalizeTournament(value) {
    const t = String(value || "").trim();
    if (!t || t === "-") return "その他の大会";

    if (t.includes("部活")) return "部活内";
    if (t.toLowerCase().includes("sola cup")) return "SOLA CUP";
    if (t.includes("HEnDA")) return "HEnDA全国大会";
    if (t.includes("HPDU推奨")) return "HPDU推奨";
    if (/JWSDC|中学生全国大会|中学全国大会/.test(t)) return "JWSDC";
    if (/WSDC|世界交流大会/.test(t)) return "WSDC";
    if (t.includes("連盟杯")) return "HPDU連盟杯";
    if (/新緑杯|新芽杯/.test(t)) return "HPDU新緑杯・新芽杯";
    if (t.includes("合宿")) return "夏合宿";
    if (/PDA首都圏公立|首都圏公立|日比谷/.test(t)) {
      return "PDA首都圏公立大会";
    }
    if (/PDA全国大会|全国大会|冬全国大会/.test(t)) {
      return "PDA全国大会";
    }
    return t;
  }

  function changeView(view) {
    ["home", "assign", "manage"].forEach(id => {
      show(id, id === view);
    });
    show("back", view !== "home");

    if (view === "assign") renderCandidates();
    if (view === "manage") renderManagement();

    window.scrollTo(0, 0);
  }

  function updateSelect(id, values, firstLabel) {
    const select = $(id);
    const previous = select.value;
    select.replaceChildren(new Option(firstLabel, ""));

    values.forEach(value => {
      select.add(new Option(value, value));
    });

    select.value = values.includes(previous) ? previous : "";
  }

  function updateFilters() {
    const tournaments = [...new Set([
      ...motions.map(m => normalizeTournament(m.tournament)),
      ...customTournaments,
      "その他の大会"
    ])].sort((a, b) => a.localeCompare(b, "ja"));

    const years = [...new Set(
      motions.map(m => String(m.year || ""))
        .filter(y => y && y !== "-")
    )].sort((a, b) => b.localeCompare(a, "ja"));

    updateSelect("preTournament", tournaments, "すべての大会");
    updateSelect("manageTournament", tournaments, "すべての大会");
    updateSelect("preYear", years, "すべての年度");
    updateSelect("manageYear", years, "すべての年度");
  }

  function matchesKeywords(text, search) {
    const words = search.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const target = text.toLowerCase();
    return words.every(word => target.includes(word));
  }

  function filteredMotions(prefix) {
    const search = $(prefix + "Search").value;
    const tournament = $(prefix + "Tournament").value;
    const year = $(prefix + "Year").value;
    const status = $(prefix + "Status").value;

    return motions.filter(m => {
      const norm = normalizeTournament(m.tournament);
      const y = String(m.year || "");
      const target = [m.motion || "", norm, m.tournament || "", y].join(" ");

      if (!matchesKeywords(target, search)) return false;
      if (tournament && norm !== tournament) return false;
      if (year && y !== year) return false;

      const done = recentHistory(m).length > 0;
      if (status === "done" && !done) return false;
      if (status === "not_done" && done) return false;

      return true;
    });
  }

  function motionItem(m, management = false) {
    const item = element("div", undefined, "item");
    const title = element("strong", m.motion || "論題名なし");
    const meta = element(
      "div",
      `${normalizeTournament(m.tournament)} / ${m.year || "年度なし"}`,
      "muted"
    );

    item.append(title, meta);

    if (management) {
      const history = recentHistory(m);
      item.append(element(
        "div",
        `直近1年の実施回数：${history.length}回`,
        "muted"
      ));

      const actions = element("div", undefined, "item-actions");
      actions.append(
        makeButton("編集", () => startEdit(m.id)),
        makeButton("削除", () => deleteMotion(m.id), "danger small")
      );
      item.append(actions);
    } else {
      item.append(makeButton(
        "記録する",
        () => openRecordModal(m.id)
      ));
    }

    return item;
  }

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function renderCandidates() {
    const container = $("candidates");
    container.replaceChildren();

    const candidates = shuffleArray([...motions]).slice(0, 4);

    if (!candidates.length) {
      container.append(element("p", "論題がありません。", "muted"));
    }

    candidates.forEach(m => container.append(motionItem(m)));
    renderPreSearch();
  }

  function renderPreSearch() {
    const container = $("preResults");
    container.replaceChildren();

    const active =
      $("preSearch").value.trim() ||
      $("preTournament").value ||
      $("preYear").value ||
      $("preStatus").value !== "all";

    if (!active) return;

    const results = filteredMotions("pre");
    container.append(element("p", `${results.length}件ヒット`, "muted"));

    results.slice(0, 200).forEach(m => {
      container.append(motionItem(m));
    });

    if (results.length > 200) {
      container.append(element(
        "p",
        "先頭200件を表示しています。検索条件を追加してください。",
        "muted"
      ));
    }
  }

  function renderManagement() {
    const container = $("manageList");
    container.replaceChildren();

    const results = filteredMotions("manage");

    container.append(element(
      "p",
      `${results.length}件 / 全${motions.length}件`,
      "muted"
    ));

    results.slice(0, 300).forEach(m => {
      container.append(motionItem(m, true));
    });

    if (results.length > 300) {
      container.append(element(
        "p",
        "先頭300件を表示しています。",
        "muted"
      ));
    }
  }

  async function fetchMotions() {
    if (!db) {
      $("connection").textContent = "Supabaseに接続できません。";
      return;
    }

    try {
      const all = [];
      let offset = 0;

      while (true) {
        const response = await fetch(
          '/api/motion-list?offset=' + offset,
          { cache: 'no-store' }
        );
        if (!response.ok) throw new Error("論題の取得に失敗しました");
        const data = await response.json();

        all.push(...(data || []));

        if (!data || data.length < 1000) break;

        offset += 1000;
        if (offset >= 50000) {
          throw new Error("取得上限を超えました。");
        }
      }

      motions = all.filter(m => !m.is_deleted);
      $("connection").textContent =
        `データベース接続済み・${motions.length}件`;

      updateFilters();
      renderCandidates();
      renderManagement();

    } catch (error) {
      $("connection").textContent =
        "データ取得エラー：" + error.message;
      console.error(error);
    }
  }

  function openRecordModal(id) {
    const m = motions.find(x => String(x.id) === String(id));
    if (!m) return;

    pendingId = m.id;
    $("confirmMotion").textContent = m.motion;
    setMessage("confirmError", "");
    show("confirmModal", true);
  }

  function closeRecordModal() {
    pendingId = null;
    show("confirmModal", false);
  }

  async function recordMotion() {
    if (busy || pendingId === null) return;

    if (!db) {
      setMessage("confirmError", "DBに接続できません。", "error");
      return;
    }

    const m = motions.find(x => String(x.id) === String(pendingId));
    if (!m) return;

    busy = true;
    $("record").disabled = true;

    try {
      await recordMotionApi(m.id, m.revision);

      selectedMotion = m.motion;
      $("chosenText").textContent = "記録済み：" + selectedMotion;
      show("chosen", true);

      closeRecordModal();
      await fetchMotions();

    } catch (error) {
      setMessage(
        "confirmError",
        "記録に失敗しました：" + error.message,
        "error"
      );
    } finally {
      busy = false;
      $("record").disabled = false;
    }
  }

  function resetForm() {
    editingId = null;

    ["motion", "tournament", "year", "doneDate"].forEach(id => {
      $(id).value = "";
    });

    $("done").checked = false;
    show("doneDateBox", false);
    show("cancelEdit", false);
    show("motionForm", true);
    show("previewBox", false);

    $("formHeading").textContent = "新規論題の追加";
  }

  function startEdit(id) {
    const m = motions.find(x => String(x.id) === String(id));
    if (!m) return;

    editingId = m.id;

    $("motion").value = m.motion || "";
    $("tournament").value = m.tournament === "-" ? "" : m.tournament || "";
    $("year").value = m.year === "-" ? "" : m.year || "";

    const history = historyOf(m).sort(
      (a, b) => Date.parse(b) - Date.parse(a)
    );

    $("done").checked = history.length > 0;
    show("doneDateBox", history.length > 0);

    $("doneDate").value = history.length
      ? new Date(history[0]).toISOString().slice(0, 10)
      : "";

    $("formHeading").textContent = "論題の編集";

    show("cancelEdit", true);
    show("motionForm", true);
    show("previewBox", false);
    setMessage("formStatus", "");

    window.scrollTo(0, 0);
  }

  function formData() {
    return {
      motion: $("motion").value.trim(),
      tournament: $("tournament").value.trim(),
      year: $("year").value.trim(),
      done: $("done").checked,
      date: $("doneDate").value || "2024-01-01"
    };
  }

  function previewMotion() {
    const v = formData();

    if (!v.motion) {
      setMessage("formStatus", "論題を入力してください。", "error");
      return;
    }

    const duplicate = motions.find(m =>
      String(m.id) !== String(editingId) &&
      (m.motion || "").trim().toLowerCase() === v.motion.toLowerCase() &&
      (m.tournament || "").trim().toLowerCase() === v.tournament.toLowerCase() &&
      String(m.year || "").trim().toLowerCase() === v.year.toLowerCase()
    );

    if (duplicate) {
      setMessage(
        "formStatus",
        "同一の論題・大会名・年度のデータが存在します。",
        "error"
      );
      return;
    }

    setMessage("formStatus", "");

    const container = $("previewText");
    container.replaceChildren();

    const fields = [
      ["論題", v.motion],
      ["大会名", v.tournament || "未入力"],
      ["年度", v.year || "未入力"],
      ["実施状況", v.done ? `実施済み（${v.date}）` : "未実施"]
    ];

    fields.forEach(([label, value]) => {
      const p = element("p");
      p.append(
        element("strong", label + "："),
        element("span", value)
      );
      container.append(p);
    });

    show("motionForm", false);
    show("previewBox", true);
  }

  async function saveMotion() {
    if (busy) return;

    if (!db) {
      setMessage("formStatus", "DBに接続できません。", "error");
      return;
    }

    const v = formData();
    if (!v.motion) return;

    const current = motions.find(
      m => String(m.id) === String(editingId)
    );

    let history = [];

    if (editingId !== null && current) {
      history = historyOf(current);

      if (v.done) {
        const iso = new Date(v.date + "T00:00:00").toISOString();
        if (!history.some(h => h.slice(0, 10) === v.date)) {
          history.push(iso);
        }
      } else {
        history = [];
      }
    } else if (v.done) {
      history = [new Date(v.date + "T00:00:00").toISOString()];
    }

    const payload = {
      motion: v.motion,
      tournament: v.tournament,
      year: v.year,
      history
    };

    busy = true;
    $("save").disabled = true;

    try {
      if (editingId !== null) {
        if (!current) throw new Error("編集対象が見つかりません");
        await motionApi("update", editingId, payload, current.revision);
      } else {
        await motionApi("insert", null, payload, null);
      }

      resetForm();
      setMessage("formStatus", "保存しました。", "ok");
      await fetchMotions();

    } catch (error) {
      setMessage(
        "formStatus",
        "保存に失敗しました：" + error.message,
        "error"
      );
    } finally {
      busy = false;
      $("save").disabled = false;
    }
  }

  async function deleteMotion(id) {
    const m = motions.find(x => String(x.id) === String(id));

    if (!m || !db || busy) return;

    if (!confirm(`「${m.motion}」を削除しますか？`)) return;

    busy = true;

    try {
      await motionApi("delete", id, null, m.revision);

      setMessage("formStatus", "削除しました。", "ok");
      await fetchMotions();

    } catch (error) {
      setMessage(
        "formStatus",
        "削除に失敗しました：" + error.message,
        "error"
      );
    } finally {
      busy = false;
    }
  }

  function generateAssignments() {
    const participants = $("participants").value
      .split(/\r?\n/).map(s => s.trim()).filter(Boolean);

    const judges = $("judges").value
      .split(/\r?\n/).map(s => s.trim()).filter(Boolean);

    const pairs = Number($("pairs").value);
    const size = Number($("teamSize").value);
    const result = $("assignResult");

    result.replaceChildren();

    if (!Number.isInteger(size) || size < 1 || size > 30) {
      result.append(element(
        "div",
        "チーム人数は1～30で指定してください。",
        "notice error"
      ));
      return;
    }

    if (!participants.length) {
      result.append(element(
        "div",
        "参加者を入力してください。",
        "notice error"
      ));
      return;
    }

    try {
      localStorage.setItem("debate_participants", $("participants").value);
      localStorage.setItem("debate_judges", $("judges").value);
    } catch (error) {
      console.warn(error);
    }

    shuffleArray(participants);
    shuffleArray(judges);

    const capacity = pairs * 2 * size;
    const overflow = participants.splice(capacity);
    judges.push(...overflow);

    if (overflow.length) {
      result.append(element(
        "p",
        `定員超過の${overflow.length}人をジャッジ候補にしました。`,
        "notice"
      ));
    }

    const completePairs = Math.min(
      pairs,
      Math.floor(participants.length / (size * 2))
    );

    if (!completePairs) {
      result.append(element(
        "div",
        `最低${size * 2}人必要です。`,
        "notice error"
      ));
      return;
    }

    const teams = [];

    for (let i = 0; i < completePairs * 2; i++) {
      teams.push(participants.splice(0, size));
    }

    for (let i = 0; i < completePairs; i++) {
      const match = element("div", undefined, "match");
      match.append(element("strong", `Match ${i + 1}`));

      const fields = [
        ["Government", teams[i * 2].join("、")],
        ["Opposition", teams[i * 2 + 1].join("、")],
        ["Judge", judges.shift() || "未割り当て"],
        ["Motion", selectedMotion || "未選択"]
      ];

      fields.forEach(([label, value]) => {
        const p = element("p");
        p.append(
          element("strong", label + "："),
          element("span", value)
        );
        match.append(p);
      });

      result.append(match);
    }

    if (participants.length) {
      result.append(element(
        "p",
        "未割り当ての参加者：" + participants.join("、"),
        "muted"
      ));
    }

    if (judges.length) {
      result.append(element(
        "p",
        "その他のジャッジ：" + judges.join("、"),
        "muted"
      ));
    }
  }

  function downloadJSON() {
    const blob = new Blob(
      [JSON.stringify(motions, null, 2)],
      { type: "application/json;charset=utf-8" }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "motions.json";

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }

  function bindEvents() {
    for (let i = 1; i <= 10; i++) {
      $("pairs").add(new Option(
        `${i}組（${i * 2}チーム）`,
        String(i)
      ));
    }

    $("goAssign").addEventListener("click", () => changeView("assign"));
    $("goManage").addEventListener("click", () => changeView("manage"));
    $("back").addEventListener("click", () => changeView("home"));

    $("shuffle").addEventListener("click", renderCandidates);
    $("generate").addEventListener("click", generateAssignments);

    $("clearChosen").addEventListener("click", () => {
      selectedMotion = null;
      show("chosen", false);
    });

    $("closeModal").addEventListener("click", closeRecordModal);
    $("record").addEventListener("click", recordMotion);

    $("done").addEventListener("change", () => {
      show("doneDateBox", $("done").checked);
    });

    $("preview").addEventListener("click", previewMotion);

    $("revise").addEventListener("click", () => {
      show("previewBox", false);
      show("motionForm", true);
    });

    $("save").addEventListener("click", saveMotion);

    $("cancelEdit").addEventListener("click", () => {
      resetForm();
      setMessage("formStatus", "");
    });

    $("export").addEventListener("click", downloadJSON);
    $("reload").addEventListener("click", fetchMotions);

    $("addTournament").addEventListener("click", () => {
      const name = prompt("追加する大会名を入力してください。");
      if (name && name.trim()) {
        customTournaments.push(name.trim());
        updateFilters();
      }
    });

    ["pre", "manage"].forEach(prefix => {
      ["Search", "Tournament", "Year", "Status"].forEach(suffix => {
        const event = suffix === "Search" ? "input" : "change";
        const render = prefix === "pre"
          ? renderPreSearch
          : renderManagement;

        $(prefix + suffix).addEventListener(event, render);
      });
    });

    try {
      $("participants").value =
        localStorage.getItem("debate_participants") || "";
      $("judges").value =
        localStorage.getItem("debate_judges") || "";
    } catch (error) {
      console.warn(error);
    }
  }

  bindEvents();

  try {
    db = { mode: "protected-api" };
    fetchMotions();

  } catch (error) {
    $("connection").textContent = "接続エラー：" + error.message;
    console.error(error);
  }
})();
</script>
</body>
</html>
