<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チーム分け＆論題管理ツール</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 1.8rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            padding: 24px;
            margin-bottom: 24px;
        }
        h2 {
            font-size: 1.25rem;
            margin-top: 0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            margin-bottom: 16px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        textarea, input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .btn-secondary {
            background-color: #64748b;
        }
        .btn-secondary:hover {
            background-color: #475569;
        }
        .home-menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }
        .home-menu button {
            font-size: 1.1rem;
            padding: 18px;
        }
        .back-btn {
            background-color: #e2e8f0;
            color: #475569;
            margin-bottom: 20px;
            width: auto;
            padding: 8px 16px;
            font-size: 0.9rem;
        }
        .back-btn:hover {
            background-color: #cbd5e1;
        }
        .result-box {
            background: #f1f5f9;
            border-left: 4px solid var(--primary-color);
            padding: 16px;
            border-radius: 4px;
            margin-top: 16px;
        }
        .note {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: -8px;
            margin-bottom: 12px;
        }
        .badge {
            display: inline-block;
            background: #e2e8f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 4px;
        }
        #submitStatus {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>チーム分け&論題選択ページ</h1>

    <!-- ホーム画面（2つのボタンのみ） -->
    <div class="card" id="homeView">
        <h2>メニュー</h2>
        <p class="note">行いたい操作のボタンを押してください。</p>
        <div class="home-menu">
            <button onclick="switchView('assignView')">チーム分け ＆ 論題選択ツール</button>
            <button class="btn-secondary" onclick="switchView('motionView')">新規論題追加ページ</button>
        </div>
    </div>

    <!-- 1. チーム分け＆論題選択セクション -->
    <div class="card hidden" id="assignView">
        <button class="back-btn" onclick="switchView('homeView')">← メニューに戻る</button>
        <h2>チーム分け ＆ 論題選択ツール</h2>
        
        <div class="grid-2">
            <div>
                <label for="participants">参加者リスト (改行区切り)</label>
                <textarea id="participants" </textarea>
                <div class="note">※定員を超えた余剰メンバーは自動的にジャッジに回ります</div>
            </div>
            <div>
                <label for="judges">ジャッジリスト (改行区切り)</label>
                <textarea id="judges" placeholder="審判 A&#10;審判 B..."></textarea>
            </div>
        </div>

        <div class="grid-2">
            <div>
                <label for="targetTeams">作成するチーム数（試合数など）</label>
                <input type="number" id="targetTeams" value="2" min="1">
            </div>
            <div>
                <label for="membersPerTeam">1チームあたりの人数</label>
                <input type="number" id="membersPerTeam" value="2" min="1">
            </div>
        </div>

        <button onclick="generateAssignments()">チーム・ジャッジ・論題を割り振る</button>

        <!-- 割り当て結果表示エリア -->
        <div id="resultCard" class="hidden" style="margin-top: 24px;">
            <h3 style="border-bottom: 2px solid #e2e8f0; padding-bottom: 6px;">割り当て結果</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <!-- 2. 新規論題追加セクション -->
    <div class="card hidden" id="motionView">
        <button class="back-btn" onclick="switchView('homeView')">← メニューに戻る</button>
        <h2>新規論題の追加（データベースへ保存）</h2>
        <p class="note">論題集データベースに論題を追加できます。</p>
        
        <label for="newMotion">論題 (Motion) <span style="color:red;">*</span></label>
        <input type="text" id="newMotion" placeholder="This house would...">

        <div class="grid-2">
            <div>
                <label for="newTournament">大会名 (Tournament)</label>
                <input type="text" id="newTournament" placeholder="例: Asian Spring 2026">
            </div>
            <div>
                <label for="newYear">年度 (Year)</label>
                <input type="text" id="newYear" placeholder="例: 2026">
            </div>
        </div>

        <button class="btn-secondary" onclick="addNewMotion()">論題をデータベースに追加する</button>
        <div id="submitStatus"></div>
    </div>
</div>

<script>
    let motionsCache = [];

    // 起動時に motions.json を読み込む
    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch('motions.json');
            if (res.ok) {
                motionsCache = await res.json();
            }
        } catch (e) {
            console.error('motions.jsonの読み込みに失敗しました', e);
        }
    });

    // 画面の切り替え関数
    function switchView(viewId) {
        document.getElementById('homeView').classList.add('hidden');
        document.getElementById('assignView').classList.add('hidden');
        document.getElementById('motionView').classList.add('hidden');

        document.getElementById(viewId).classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 割り当て実行ロジック
    function generateAssignments() {
        const participantsText = document.getElementById('participants').value.trim();
        const judgesText = document.getElementById('judges').value.trim();
        const targetTeams = parseInt(document.getElementById('targetTeams').value) || 2;
        const membersPerTeam = parseInt(document.getElementById('membersPerTeam').value) || 2;

        if (!participantsText) {
            alert('参加者リストを入力してください。');
            return;
        }

        let participants = participantsText.split('\n').map(s => s.trim()).filter(s => s.length > 0);
        let judges = judgesText ? judgesText.split('\n').map(s => s.trim()).filter(s => s.length > 0) : [];

        const shuffle = (array) => {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        };

        shuffle(participants);
        shuffle(judges);

        // 定員の計算と超過分のジャッジへの繰り越し処理
        const totalCapacity = targetTeams * membersPerTeam;
        let overflowNotice = "";
        if (participants.length > totalCapacity) {
            const extraCount = participants.length - totalCapacity;
            const extraParticipants = participants.splice(totalCapacity);
            judges = judges.concat(extraParticipants);
            overflowNotice = `<p style="color: #d97706; font-weight: bold; font-size: 0.9rem;">参加者が定員（${totalCapacity}人）より ${extraCount} 人多いため、あふれたメンバーを自動的にジャッジに割り振りました。</p>`;
        }

        let teams = [];
        for (let i = 0; i < targetTeams; i++) {
            let members = participants.splice(0, membersPerTeam);
            if (members.length > 0) {
                teams.push({
                    name: `Team ${i + 1}`,
                    members: members
                });
            }
        }

        let html = overflowNotice;
        let matchCount = Math.floor(teams.length / 2);

        if (matchCount === 0) {
            html += `<p>チームを組むのに十分な参加者がいません（最低でも1チーム分の人数が必要です）。</p>`;
        } else {
            for (let i = 0; i < matchCount; i++) {
                const gov = teams[i * 2];
                const opp = teams[i * 2 + 1];

                let randomMotionInfo = "ランダム論題が割り当てられました";
                if (motionsCache.length > 0) {
                    const m = motionsCache[Math.floor(Math.random() * motionsCache.length)];
                    randomMotionInfo = `[ID: ${m.id}] 大会: ${m.tournament || '-'} (${m.year || '-'})`;
                }

                html += `
                    <div class="result-box">
                        <strong>Match ${i + 1}</strong><br>
                        🔹 <strong>Government:</strong> ${gov.members.join(', ')}<br>
                        🔸 <strong>Opposition:</strong> ${opp.members.join(', ')}<br>
                        📜 <strong>Assigned Motion:</strong> <span class="badge">秘密（試合開始後に発表）</span> <span style="font-size:0.85rem; color:#64748b;">(${randomMotionInfo})</span>
                    </div>
                `;
            }
        }

        html += `<div style="margin-top: 20px;"><strong>👨‍⚖️ Assigned Judges:</strong> ${judges.length > 0 ? judges.join(', ') : 'なし'}</div>`;

        document.getElementById('resultContent').innerHTML = html;
        document.getElementById('resultCard').classList.remove('hidden');
    }

    // 新規論題追加処理
    async function addNewMotion() {
        const motion = document.getElementById('newMotion').value.trim();
        const tournament = document.getElementById('newTournament').value.trim();
        const year = document.getElementById('newYear').value.trim();
        const statusEl = document.getElementById('submitStatus');

        if (!motion) {
            alert('論題テキストを入力してください。');
            return;
        }

        statusEl.style.color = '#2563eb';
        statusEl.innerText = '追加中...';

        try {
            const res = await fetch('/api/add-motion', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ motion, tournament, year })
            });

            const data = await res.json();

            if (res.ok) {
                statusEl.style.color = '#16a34a';
                statusEl.innerText = '論題が正常に追加されました！';
                document.getElementById('newMotion').value = '';
                document.getElementById('newTournament').value = '';
                document.getElementById('newYear').value = '';

                const updateRes = await fetch('motions.json');
                if (updateRes.ok) motionsCache = await updateRes.json();
            } else {
                throw new Error(data.error || '追加に失敗しました。');
            }
        } catch (err) {
            statusEl.style.color = '#dc2626';
            statusEl.innerText = `エラー: ${err.message}`;
        }
    }
</script>

</body>
</html>
