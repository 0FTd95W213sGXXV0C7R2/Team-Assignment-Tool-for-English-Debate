<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>チーム分け＆論題管理システム</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1e293b;background:#f8fafc}
*{box-sizing:border-box}
body{margin:0;padding:12px 14px 40px}
main{max-width:920px;margin:auto}
h1{font-size:1.5rem;color:#2563eb}
h2{font-size:1.2rem;margin-top:0}
h3{font-size:1.05rem;color:#2563eb}
.card{background:white;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 2px 10px #00000010}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{display:block;font-weight:600;margin:12px 0 5px}
input,textarea,select{width:100%;padding:11px;font:inherit;border:1px solid #cbd5e1;border-radius:8px;background:white}
textarea{min-height:120px;resize:vertical}
input[type=checkbox]{width:auto}
button{background:#2563eb;color:white;border:0;border-radius:8px;padding:11px 15px;min-height:44px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#64748b}.danger{background:#dc2626}.success{background:#16a34a}
.small{font-size:.85rem;padding:7px 11px;min-height:36px}.full{width:100%}
.muted{font-size:.88rem;color:#64748b}
.item{padding:12px;border:1px solid #cbd5e1;border-radius:8px;margin:9px 0;overflow-wrap:anywhere}
.item-actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.panel{background:#f1f5f9;padding:14px;border-radius:9px}
.notice{padding:12px;margin-top:12px;border-radius:8px;background:#dbeafe;white-space:pre-wrap;overflow-wrap:anywhere}
.error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}
.scroll{max-height:400px;overflow-y:auto}
.match{padding:14px;border-left:4px solid #2563eb;background:#f1f5f9;margin:12px 0;border-radius:8px}
header{position:sticky;top:0;z-index:10;background:#f8fafc;padding:5px 0 10px}
.modal{position:fixed;inset:0;z-index:20;background:#0008;display:grid;place-items:center;padding:16px}
.dialog{background:white;border-radius:12px;padding:20px;width:min(100%,500px);max-height:90vh;overflow-y:auto}
@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:15px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
<header>
  <div class="row" style="justify-content:space-between">
    <h1>チーム分け＆論題管理システム</h1>
    <div class="row">
      <span id="userLabel" class="muted"></span>
      <button id="logout" class="secondary small hidden" type="button">ログアウト</button>
      <button id="back" class="secondary small hidden" type="button">← メニュー</button>
    </div>
  </div>
  <div id="connection" class="muted">認証設定を読み込み中…</div>
</header>

<section id="auth" class="card hidden">
  <h2>ログイン・新規登録</h2>
  <button id="googleLogin" class="full" type="button">Googleでログイン</button>
  <form id="loginForm">
    <label for="authEmail">メールアドレス</label>
    <input id="authEmail" type="email" autocomplete="email" required>
    <label for="authPassword">パスワード</label>
    <input id="authPassword" type="password" autocomplete="current-password" minlength="8" required>
    <div class="row" style="margin-top:14px">
      <button id="loginButton" type="submit">ログイン</button>
      <button id="signupButton" class="secondary" type="button">新規登録</button>
    </div>
  </form>
  <div id="authStatus" class="notice hidden" role="status" aria-live="polite"></div>
</section>

<section id="home" class="card hidden">
  <h2>メニュー</h2>
  <button id="goAssign" class="full" type="button">チーム分け＆論題記録</button>
  <button id="goManage" class="secondary full" style="margin-top:12px" type="button">論題管理</button>
</section>

<section id="assign" class="hidden">
  <div class="card">
    <h2>1. 論題選択・実施記録</h2>
    <button id="shuffle" class="secondary small" type="button">候補をシャッフル</button>
    <div id="candidates"></div>
    <h3>論題検索</h3>
    <input id="preSearch" type="search" placeholder="キーワード">
    <div class="grid">
      <select id="preTournament"><option value="">すべての大会</option></select>
      <select id="preYear"><option value="">すべての年度</option></select>
    </div>
    <select id="preStatus" style="margin-top:10px">
      <option value="all">すべての実施状況</option>
      <option value="done">直近1年に実施</option>
      <option value="not_done">直近1年に未実施</option>
    </select>
    <div id="preResults" class="scroll"></div>
    <div id="chosen" class="notice ok hidden">
      <div id="chosenText"></div>
      <button id="clearChosen" class="danger small" type="button">選択解除</button>
    </div>
  </div>
  <div class="card">
    <h2>2. チーム設定</h2>
    <div class="grid">
      <div><label for="participants">参加者（1行に1人）</label><textarea id="participants"></textarea></div>
      <div><label for="judges">事前指定ジャッジ</label><textarea id="judges"></textarea></div>
      <div><label for="pairs">試合数</label><select id="pairs"></select></div>
      <div><label for="teamSize">1チームの人数</label><input id="teamSize" type="number" min="1" max="30" value="3"></div>
    </div>
    <button id="generate" class="full" type="button">チームを割り振る</button>
    <div id="assignResult"></div>
  </div>
</section>

<section id="manage" class="hidden">
  <div class="card">
    <h2 id="formHeading">新規論題の追加</h2>
    <label for="motion">論題</label>
    <textarea id="motion" style="min-height:75px" required></textarea>
    <div class="grid">
      <div><label for="tournament">大会名</label><input id="tournament" placeholder="HPDU推奨"></div>
      <div><label for="year">年度</label><input id="year" inputmode="numeric" maxlength="4" placeholder="2026"></div>
    </div>
    <label><input id="done" type="checkbox"> 実施済み</label>
    <div id="doneDateBox" class="hidden">
      <label for="doneDate">実施日（不明なら2024-01-01）</label>
      <input id="doneDate" type="date">
    </div>
    <div class="row" style="margin-top:14px">
      <button id="preview" type="button">内容を確認</button>
      <button id="cancelEdit" class="secondary hidden" type="button">編集をキャンセル</button>
    </div>
    <div id="previewBox" class="panel hidden">
      <h3>確認</h3><div id="previewText"></div>
      <div class="row">
        <button id="revise" class="secondary" type="button">修正</button>
        <button id="save" class="success" type="button">保存</button>
      </div>
    </div>
    <div id="formStatus" class="notice hidden" role="status"></div>
  </div>
  <div class="card">
    <h2>登録済み論題</h2>
    <input id="manageSearch" type="search" placeholder="キーワード検索">
    <div class="grid">
      <select id="manageTournament"><option value="">すべての大会</option></select>
      <select id="manageYear"><option value="">すべての年度</option></select>
    </div>
    <select id="manageStatus" style="margin-top:10px">
      <option value="all">すべての実施状況</option>
      <option value="done">直近1年に実施</option>
      <option value="not_done">直近1年に未実施</option>
    </select>
    <div class="row" style="margin-top:12px">
      <button id="addTournament" class="secondary small" type="button">大会選択肢を追加</button>
      <button id="export" class="secondary small" type="button">JSONをダウンロード</button>
      <button id="reload" class="secondary small" type="button">再読み込み</button>
    </div>
    <div id="manageList" class="scroll"></div>
    <h3>削除済み論題</h3>
    <div id="deletedList" class="scroll"></div>
  </div>
</section>
</main>

<div id="confirmModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="dialog">
    <h2>実施記録の確認</h2>
    <div id="confirmMotion" class="panel"></div>
    <div id="confirmError" class="notice error hidden"></div>
    <div class="row" style="margin-top:15px">
      <button id="closeModal" class="secondary" type="button">キャンセル</button>
      <button id="record" class="success" type="button">記録する</button>
    </div>
  </div>
</div>

<div id="historyModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="dialog">
    <h2>変更履歴</h2>
    <div id="historyContent"></div>
    <button id="closeHistory" class="secondary" type="button">閉じる</button>
  </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const $ = id => document.getElementById(id);
const show = (id, visible) => $(id).classList.toggle("hidden", !visible);

function message(id, text, type = "") {
  const el = $(id);
  el.textContent = text;
  el.className = "notice" + (type ? " " + type : "");
  show(id, Boolean(text));
}

function node(tag, text, className = "") {
  const el = document.createElement(tag);
  if (text !== undefined) el.textContent = String(text);
  if (className) el.className = className;
  return el;
}

function button(text, handler, className = "secondary small") {
  const el = node("button", text, className);
  el.type = "button";
  el.addEventListener("click", handler);
  return el;
}

let supabase = null;
let currentUser = null;
let motions = [];
let selectedMotion = null;
let pendingMotionId = null;
let editingId = null;
let busy = false;
let customTournaments = [];

function normalizeTournament(value) {
  const t = String(value || "").trim();
  if (!t || t === "-") return "その他の大会";
  if (t.toLowerCase().includes("sola cup")) return "SOLA CUP";
  if (t.includes("HPDU推奨")) return "HPDU推奨";
  if (t.includes("連盟杯")) return "HPDU連盟杯";
  if (/新緑杯|新芽杯/.test(t)) return "HPDU新緑杯・新芽杯";
  if (t.includes("HEnDA")) return "HEnDA全国大会";
  if (/PDA全国大会|冬全国大会/.test(t)) return "PDA全国大会";
  if (/PDA首都圏公立|首都圏公立|日比谷/.test(t)) return "PDA首都圏公立大会";
  return t;
}

function historyOf(motion) {
  return Array.isArray(motion?.history)
    ? motion.history.filter(v => typeof v === "string" && !Number.isNaN(Date.parse(v)))
    : [];
}

function recentHistory(motion) {
  const cutoff = new Date();
  cutoff.setFullYear(cutoff.getFullYear() - 1);
  const now = new Date();
  return historyOf(motion).filter(v => {
    const d = new Date(v);
    return d >= cutoff && d <= now;
  });
}

async function api(path, options = {}) {
  if (!supabase) throw new Error("Supabaseクライアントが初期化されていません。");

  const { data, error: sessionError } = await supabase.auth.getSession();
  if (sessionError) throw sessionError;

  const headers = new Headers(options.headers || {});
  if (data.session?.access_token) {
    headers.set("Authorization", `Bearer ${data.session.access_token}`);
  }
  if (options.body && !(options.body instanceof FormData) && !headers.has("Content-Type")) {
    headers.set("Content-Type", "application/json; charset=utf-8");
  }

  const response = await fetch(path, {
    ...options,
    headers,
    credentials: "same-origin",
    cache: "no-store"
  });

  const contentType = response.headers.get("content-type") || "";
  let result;
  if (contentType.includes("application/json")) {
    result = await response.json().catch(() => ({}));
  } else {
    const text = await response.text().catch(() => "");
    result = text ? { error: text } : {};
  }

  if (response.status === 401 && !path.startsWith("/api/auth-")) {
    showAuth("ログイン状態を確認できません。再度ログインしてください。");
  }

  if (!response.ok) {
    const error = new Error(result.message || result.error || `APIエラー（${response.status}）`);
    error.status = response.status;
    error.code = result.code || result.errorCode || null;
    throw error;
  }
  return result;
}

function showAuth(text = "") {
  currentUser = null;
  ["home", "assign", "manage", "logout", "back"].forEach(id => show(id, false));
  show("auth", true);
  $("userLabel").textContent = "";
  $("connection").textContent = "ログインが必要です。";
  message("authStatus", text, text ? "error" : "");
}

function showApp(user) {
  currentUser = user;
  show("auth", false);
  show("home", true);
  show("logout", true);
  $("userLabel").textContent = user.email || user.userId || user.id || "ログイン中";
  $("connection").textContent = "論題データを読み込み中…";
  changeView("home");
  fetchMotions();
}

function changeView(view) {
  ["home", "assign", "manage"].forEach(id => show(id, id === view));
  show("back", view !== "home");
  if (view === "assign") renderCandidates();
  if (view === "manage") renderManagement();
  window.scrollTo(0, 0);
}

async function validateSession(session) {
  if (!session?.access_token) return false;
  const result = await api("/api/auth-me");
  return result.authenticated === true && result.isAdmin === true;
}

let checkingSession = false;
async function checkSession() {
  if (!supabase || checkingSession) return;
  checkingSession = true;
  try {
    const { data, error } = await supabase.auth.getSession();
    if (error) throw error;
    if (!data.session) {
      showAuth();
      return;
    }
    const valid = await validateSession(data.session);
    if (!valid) {
      showAuth("サーバーで管理者権限を確認できませんでした。設定と権限を確認してください。");
      return;
    }
    showApp(data.session.user);
  } catch (error) {
    console.error("Session validation failed:", error);
    showAuth("ログイン状態を確認できませんでした。通信状態とサーバー設定を確認してください。");
  } finally {
    checkingSession = false;
  }
}

async function login(event) {
  event.preventDefault();
  if (busy) return;
  busy = true;
  $("loginButton").disabled = true;
  message("authStatus", "ログイン中…");
  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email: $("authEmail").value.trim(),
      password: $("authPassword").value
    });
    if (error) throw error;
    if (!data.session || !(await validateSession(data.session))) {
      throw new Error("ログインできませんでした。管理者権限とサーバー設定を確認してください。");
    }
    $("authPassword").value = "";
    showApp(data.user);
  } catch (error) {
    message("authStatus", error.message, "error");
  } finally {
    busy = false;
    $("loginButton").disabled = false;
  }
}

async function signup() {
  if (busy || !$("loginForm").reportValidity()) return;
  busy = true;
  $("signupButton").disabled = true;
  try {
    const { error } = await supabase.auth.signUp({
      email: $("authEmail").value.trim(),
      password: $("authPassword").value,
      options: { emailRedirectTo: location.origin + location.pathname }
    });
    if (error) throw error;
    $("authPassword").value = "";
    message("authStatus", "登録処理を受け付けました。確認メールを開いてからログインしてください。", "ok");
  } catch (error) {
    message("authStatus", error.message, "error");
  } finally {
    busy = false;
    $("signupButton").disabled = false;
  }
}

async function googleLogin() {
  if (busy) return;
  busy = true;
  $("googleLogin").disabled = true;
  try {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: location.origin + location.pathname }
    });
    if (error) throw error;
  } catch (error) {
    message("authStatus", error.message, "error");
    busy = false;
    $("googleLogin").disabled = false;
  }
}

async function logout() {
  if (!supabase || busy) return;
  busy = true;
  try {
    const { error } = await supabase.auth.signOut();
    if (error) throw error;
  } catch (error) {
    console.error("Logout failed:", error);
  } finally {
    busy = false;
    motions = [];
    selectedMotion = null;
    showAuth("ログアウトしました。");
  }
}

async function fetchMotions() {
  if (!currentUser) return;
  try {
    const result = await api("/api/motion-list");
    if (!Array.isArray(result.motions)) throw new Error("論題データの形式が正しくありません。");
    motions = result.motions;
    $("connection").textContent = `ログイン中：${currentUser.email || ""} / ${motions.filter(m => !m.is_deleted).length}件`;
    updateFilters();
    renderCandidates();
    renderManagement();
  } catch (error) {
    $("connection").textContent = "データ取得エラー：" + error.message;
    console.error(error);
  }
}

function updateSelect(id, values, label) {
  const select = $(id);
  const previous = select.value;
  select.replaceChildren(new Option(label, ""));
  values.forEach(v => select.add(new Option(v, v)));
  select.value = values.includes(previous) ? previous : "";
}

function updateFilters() {
  const active = motions.filter(m => !m.is_deleted);
  const tournaments = [...new Set([
    ...active.map(m => normalizeTournament(m.tournament)),
    ...customTournaments,
    "その他の大会"
  ])].sort((a, b) => a.localeCompare(b, "ja"));
  const years = [...new Set(active.map(m => String(m.year || "")).filter(y => y && y !== "-"))]
    .sort((a, b) => b.localeCompare(a));

  ["preTournament", "manageTournament"].forEach(id => updateSelect(id, tournaments, "すべての大会"));
  ["preYear", "manageYear"].forEach(id => updateSelect(id, years, "すべての年度"));
}

function matchesKeywords(text, search) {
  return search.trim().toLowerCase().split(/\s+/).filter(Boolean)
    .every(word => text.toLowerCase().includes(word));
}

function filteredMotions(prefix) {
  const search = $(prefix + "Search").value;
  const tournament = $(prefix + "Tournament").value;
  const year = $(prefix + "Year").value;
  const status = $(prefix + "Status").value;

  return motions.filter(m => {
    if (m.is_deleted) return false;
    const norm = normalizeTournament(m.tournament);
    if (!matchesKeywords(`${m.motion || ""} ${norm} ${m.tournament || ""} ${m.year || ""}`, search)) return false;
    if (tournament && norm !== tournament) return false;
    if (year && String(m.year || "") !== year) return false;
    const done = recentHistory(m).length > 0;
    if (status === "done" && !done) return false;
    if (status === "not_done" && done) return false;
    return true;
  });
}

function motionItem(m, management = false) {
  const item = node("div", undefined, "item");
  item.append(
    node("strong", m.motion || "論題名なし"),
    node("div", `${normalizeTournament(m.tournament)} / ${m.year || "年度なし"}`, "muted")
  );

  if (management) {
    item.append(node("div", `直近1年の実施回数：${recentHistory(m).length}回`, "muted"));
    const actions = node("div", undefined, "item-actions");
    actions.append(
      button("編集", () => startEdit(m.id)),
      button("履歴", () => showHistory(m.id)),
      button("削除", () => deleteMotion(m.id), "danger small")
    );
    item.append(actions);
  } else {
    item.append(button("この論題を選択", () => {
      selectedMotion = m.motion;
      $("chosenText").textContent = "選択中：" + selectedMotion;
      show("chosen", true);
    }));
    item.append(button("実施記録", () => openRecordModal(m.id)));
  }
  return item;
}

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function renderCandidates() {
  const container = $("candidates");
  container.replaceChildren();
  const candidates = shuffleArray(motions.filter(m => !m.is_deleted).slice()).slice(0, 4);
  if (!candidates.length) container.append(node("p", "論題がありません。", "muted"));
  candidates.forEach(m => container.append(motionItem(m)));
  renderPreSearch();
}

function renderPreSearch() {
  const container = $("preResults");
  container.replaceChildren();
  if (!$("preSearch").value.trim() && !$("preTournament").value &&
      !$("preYear").value && $("preStatus").value === "all") return;
  const results = filteredMotions("pre");
  container.append(node("p", `${results.length}件`, "muted"));
  results.slice(0, 200).forEach(m => container.append(motionItem(m)));
}

function renderManagement() {
  const list = $("manageList");
  const deleted = $("deletedList");
  list.replaceChildren();
  deleted.replaceChildren();

  const results = filteredMotions("manage");
  list.append(node("p", `${results.length}件`, "muted"));
  results.slice(0, 300).forEach(m => list.append(motionItem(m, true)));

  const removed = motions.filter(m => m.is_deleted);
  deleted.append(node("p", `${removed.length}件`, "muted"));
  removed.slice(0, 200).forEach(m => {
    const item = node("div", undefined, "item");
    item.append(
      node("strong", m.motion || "論題名なし"),
      node("div", `${normalizeTournament(m.tournament)} / ${m.year || ""}`, "muted"),
      button("履歴から復元", () => restoreMotion(m.id), "success small")
    );
    deleted.append(item);
  });
}

function openRecordModal(id) {
  const m = motions.find(x => String(x.id) === String(id) && !x.is_deleted);
  if (!m) return;
  pendingMotionId = m.id;
  $("confirmMotion").textContent = m.motion;
  message("confirmError", "");
  show("confirmModal", true);
}

function closeRecordModal() {
  pendingMotionId = null;
  show("confirmModal", false);
}

async function recordMotion() {
  if (busy || pendingMotionId === null) return;
  const m = motions.find(x => String(x.id) === String(pendingMotionId));
  if (!m) return;
  busy = true;
  $("record").disabled = true;
  try {
    const payload = { id: String(m.id) };
    if (m.revision !== undefined) payload.expectedRevision = m.revision;
    await api("/api/motion-record", { method: "POST", body: JSON.stringify(payload) });
    closeRecordModal();
    await fetchMotions();
    message("formStatus", "実施記録を保存しました。", "ok");
  } catch (error) {
    message("confirmError", "記録に失敗しました：" + error.message, "error");
  } finally {
    busy = false;
    $("record").disabled = false;
  }
}

async function showHistory(id) {
  const content = $("historyContent");
  content.replaceChildren(node("p", "履歴を読み込み中…", "muted"));
  show("historyModal", true);
  try {
    const result = await api(`/api/motion-history?motionId=${encodeURIComponent(id)}`);
    content.replaceChildren();
    const history = Array.isArray(result.history) ? result.history : [];
    if (!history.length) {
      content.append(node("p", "履歴はありません。", "muted"));
      return;
    }
    history.forEach(h => {
      const item = node("div", undefined, "item");
      item.append(node("strong", `${h.changed_at || "日時不明"} — ${h.action || "変更"}`));
      if (h.before_data) item.append(node("p", "変更前：" + (h.before_data.motion || "論題名なし")));
      if (h.after_data) item.append(node("p", "変更後：" + (h.after_data.motion || "論題名なし")));
      content.append(item);
    });
  } catch (error) {
    content.replaceChildren(node("p", "履歴取得エラー：" + error.message, "error"));
  }
}

function resetForm() {
  editingId = null;
  ["motion", "tournament", "year", "doneDate"].forEach(id => $(id).value = "");
  $("done").checked = false;
  show("doneDateBox", false);
  show("cancelEdit", false);
  show("motionForm", true);
  show("previewBox", false);
  $("formHeading").textContent = "新規論題の追加";
}

function startEdit(id) {
  const m = motions.find(x => String(x.id) === String(id) && !x.is_deleted);
  if (!m) return;
  editingId = m.id;
  $("motion").value = m.motion || "";
  $("tournament").value = m.tournament === "-" ? "" : m.tournament || "";
  $("year").value = m.year === "-" ? "" : m.year || "";
  const history = historyOf(m).sort((a, b) => Date.parse(b) - Date.parse(a));
  $("done").checked = history.length > 0;
  show("doneDateBox", history.length > 0);
  $("doneDate").value = history.length ? new Date(history[0]).toISOString().slice(0, 10) : "";
  $("formHeading").textContent = "論題の編集";
  show("cancelEdit", true);
  show("motionForm", true);
  show("previewBox", false);
  changeView("manage");
}

function formData() {
  return {
    motion: $("motion").value.trim(),
    tournament: $("tournament").value.trim() || "-",
    year: $("year").value.trim() || "-",
    done: $("done").checked,
    date: $("doneDate").value || "2024-01-01"
  };
}

function previewMotion() {
  const v = formData();
  if (!v.motion) {
    message("formStatus", "論題を入力してください。", "error");
    return;
  }
  const duplicate = motions.find(m =>
    !m.is_deleted &&
    String(m.id) !== String(editingId) &&
    (m.motion || "").trim().toLowerCase() === v.motion.toLowerCase() &&
    (m.tournament || "").trim().toLowerCase() === v.tournament.toLowerCase() &&
    String(m.year || "").trim() === v.year
  );
  if (duplicate) {
    message("formStatus", "同じ論題・大会名・年度のデータが存在します。", "error");
    return;
  }
  const container = $("previewText");
  container.replaceChildren();
  [
    ["論題", v.motion],
    ["大会名", v.tournament],
    ["年度", v.year],
    ["実施状況", v.done ? `実施済み（${v.date}）` : "未実施"]
  ].forEach(([label, value]) => {
    const p = node("p");
    p.append(node("strong", label + "："), node("span", value));
    container.append(p);
  });
  show("motionForm", false);
  show("previewBox", true);
  message("formStatus", "");
}

async function saveMotion() {
  if (busy) return;
  const v = formData();
  if (!v.motion || !/^\d{4}$/.test(v.year)) {
    message("formStatus", "論題と4桁の年度を入力してください。", "error");
    return;
  }
  busy = true;
  $("save").disabled = true;
  try {
    const existing = editingId === null ? null :
      motions.find(m => String(m.id) === String(editingId));
    if (editingId !== null && (!existing || existing.is_deleted)) {
      throw new Error("編集対象が見つからないか、削除済みです。");
    }

    const payload = {
      action: editingId === null ? "insert" : "update",
      motion: v.motion,
      tournament: v.tournament,
      year: v.year,
      done: v.done,
      date: v.done ? v.date : null
    };
    if (existing) {
      payload.id = String(existing.id);
      if (existing.revision !== undefined) payload.expectedRevision = existing.revision;
    }

    await api("/api/motion-write", { method: "POST", body: JSON.stringify(payload) });
    resetForm();
    message("formStatus", "保存しました。", "ok");
    await fetchMotions();
  } catch (error) {
    message("formStatus", "保存に失敗しました：" + error.message, "error");
  } finally {
    busy = false;
    $("save").disabled = false;
  }
}

async function deleteMotion(id) {
  const m = motions.find(x => String(x.id) === String(id) && !x.is_deleted);
  if (!m || busy || !confirm(`「${m.motion}」を削除しますか？`)) return;
  busy = true;
  try {
    const payload = { action: "delete", id: String(id) };
    if (m.revision !== undefined) payload.expectedRevision = m.revision;
    await api("/api/motion-write", { method: "POST", body: JSON.stringify(payload) });
    message("formStatus", "削除しました。", "ok");
    await fetchMotions();
  } catch (error) {
    message("formStatus", "削除に失敗しました：" + error.message, "error");
  } finally {
    busy = false;
  }
}

async function restoreMotion(id) {
  if (busy || !confirm("この論題を復元しますか？")) return;
  const m = motions.find(x => String(x.id) === String(id) && mIsDeleted(x));
  if (!m) {
    message("formStatus", "復元対象が見つかりません。", "error");
    return;
  }
  busy = true;
  try {
    const result = await api(`/api/motion-history?motionId=${encodeURIComponent(id)}`);
    const history = Array.isArray(result.history) ? result.history : [];
    const deletion = history.find(h =>
      String(h.action || "").toUpperCase() === "DELETE" && h.audit_id != null
    );
    if (!deletion) throw new Error("削除履歴が見つかりません。");
    const payload = { id: String(id), auditId: String(deletion.audit_id) };
    if (m.revision !== undefined) payload.expectedRevision = m.revision;
    await api("/api/motion-restore", { method: "POST", body: JSON.stringify(payload) });
    message("formStatus", "復元しました。", "ok");
    await fetchMotions();
  } catch (error) {
    message("formStatus", "復元に失敗しました：" + error.message, "error");
  } finally {
    busy = false;
  }
}

function mIsDeleted(m) {
  return Boolean(m && m.is_deleted);
}

function generateAssignments() {
  const result = $("assignResult");
  result.replaceChildren();

  const participants = $("participants").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const judges = $("judges").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const pairs = Number($("pairs").value);
  const size = Number($("teamSize").value);

  if (!participants.length) {
    result.append(node("div", "参加者を入力してください。", "notice error"));
    return;
  }
  if (!Number.isInteger(size) || size < 1 || size > 30) {
    result.append(node("div", "チーム人数は1～30で指定してください。", "notice error"));
    return;
  }

  try {
    localStorage.setItem("debate_participants", $("participants").value);
    localStorage.setItem("debate_judges", $("judges").value);
  } catch (error) {
    console.warn(error);
  }

  shuffleArray(participants);
  shuffleArray(judges);

  const capacity = pairs * 2 * size;
  judges.push(...participants.splice(capacity));

  const completePairs = Math.min(pairs, Math.floor(participants.length / (size * 2)));
  if (!completePairs) {
    result.append(node("div", `最低${size * 2}人必要です。`, "notice error"));
    return;
  }

  const teams = [];
  for (let i = 0; i < completePairs * 2; i++) {
    teams.push(participants.splice(0, size));
  }

  for (let i = 0; i < completePairs; i++) {
    const match = node("div", undefined, "match");
    match.append(node("strong", `Match ${i + 1}`));
    [
      ["Government", teams[i * 2].join("、")],
      ["Opposition", teams[i * 2 + 1].join("、")],
      ["Judge", judges.shift() || "未割り当て"],
      ["Motion", selectedMotion || "未選択"]
    ].forEach(([label, value]) => {
      const p = node("p");
      p.append(node("strong", label + "："), node("span", value));
      match.append(p);
    });
    result.append(match);
  }

  if (participants.length) result.append(node("p", "未割り当て：" + participants.join("、"), "muted"));
  if (judges.length) result.append(node("p", "その他のジャッジ：" + judges.join("、"), "muted"));
}

function downloadJSON() {
  const blob = new Blob([JSON.stringify(motions, null, 2)], {
    type: "application/json;charset=utf-8"
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "motions.json";
  a.click();
  URL.revokeObjectURL(url);
}

function bindEvents() {
  for (let i = 1; i <= 10; i++) {
    $("pairs").add(new Option(`${i}組（${i * 2}チーム）`, String(i)));
  }

  $("loginForm").addEventListener("submit", login);
  $("signupButton").addEventListener("click", signup);
  $("googleLogin").addEventListener("click", googleLogin);
  $("logout").addEventListener("click", logout);

  $("goAssign").addEventListener("click", () => changeView("assign"));
  $("goManage").addEventListener("click", () => changeView("manage"));
  $("back").addEventListener("click", () => changeView("home"));
  $("shuffle").addEventListener("click", renderCandidates);
  $("generate").addEventListener("click", generateAssignments);
  $("clearChosen").addEventListener("click", () => {
    selectedMotion = null;
    show("chosen", false);
  });

  $("closeModal").addEventListener("click", closeRecordModal);
  $("record").addEventListener("click", recordMotion);
  $("closeHistory").addEventListener("click", () => show("historyModal", false));
  $("done").addEventListener("change", () => show("doneDateBox", $("done").checked));

  $("preview").addEventListener("click", previewMotion);
  $("revise").addEventListener("click", () => {
    show("previewBox", false);
    show("motionForm", true);
  });
  $("save").addEventListener("click", saveMotion);
  $("cancelEdit").addEventListener("click", () => {
    resetForm();
    message("formStatus", "");
  });

  $("export").addEventListener("click", downloadJSON);
  $("reload").addEventListener("click", fetchMotions);
  $("addTournament").addEventListener("click", () => {
    const name = prompt("追加する大会名を入力してください。");
    if (name?.trim()) {
      customTournaments.push(name.trim());
      updateFilters();
    }
  });

  ["pre", "manage"].forEach(prefix => {
    ["Search", "Tournament", "Year", "Status"].forEach(suffix => {
      const id = prefix + suffix;
      $(id).addEventListener(suffix === "Search" ? "input" : "change", () => {
        if (prefix === "pre") renderPreSearch();
        else renderManagement();
      });
    });
  });

  try {
    $("participants").value = localStorage.getItem("debate_participants") || "";
    $("judges").value = localStorage.getItem("debate_judges") || "";
  } catch (error) {
    console.warn(error);
  }
}

bindEvents();

fetch("/api/auth-config", { cache: "no-store" })
  .then(async response => {
    const config = await response.json();
    if (!response.ok) throw new Error(config.error || "認証設定を取得できません。");

    const url = config.supabaseUrl || config.url;
    const key = config.supabaseAnonKey || config.anonKey;
    if (!url || !key) throw new Error("Supabase URL または公開キーが設定されていません。");

    supabase = createClient(url, key, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        flowType: "pkce"
      }
    });

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT") {
        motions = [];
        selectedMotion = null;
        showAuth();
      } else if (session && ["SIGNED_IN", "TOKEN_REFRESHED", "USER_UPDATED"].includes(event)) {
        queueMicrotask(() => checkSession());
      }
    });

    await checkSession();
  })
  .catch(error => {
    console.error("Auth initialization failed:", error);
    showAuth("認証設定を読み込めませんでした：" + error.message);
  });
</script>
