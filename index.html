<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>チーム分け＆論題管理ツール</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.6rem;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            margin-bottom: 16px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            body {
                padding: 10px;
            }
            .card {
                padding: 16px;
            }
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        textarea, input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px; /* スマホでの自動ズーム防止 */
            box-sizing: border-box;
            margin-bottom: 12px;
            background-color: #fff;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            min-height: 48px; /* タップしやすく改善 */
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .btn-secondary {
            background-color: #64748b;
        }
        .btn-secondary:hover {
            background-color: #475569;
        }
        .home-menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }
        .home-menu button {
            font-size: 1.1rem;
            padding: 18px;
        }
        .back-btn {
            background-color: #e2e8f0;
            color: #475569;
            margin-bottom: 20px;
            width: auto;
            padding: 10px 16px;
            font-size: 0.9rem;
            min-height: auto;
        }
        .back-btn:hover {
            background-color: #cbd5e1;
        }
        .result-box {
            background: #f1f5f9;
            border-left: 4px solid var(--primary-color);
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
        }
        .note {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: -8px;
            margin-bottom: 12px;
        }
        .badge {
            display: inline-block;
            background: #e2e8f0;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-right: 4px;
            word-break: break-all;
        }
        #submitStatus {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
        }
        .hidden {
            display: none;
        }
        .motion-selection-area {
            margin-top: 12px;
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .motion-candidate-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        @media (min-width: 500px) {
            .motion-candidate-item {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }
        .motion-candidate-item button {
            width: auto;
            padding: 6px 12px;
            font-size: 0.85rem;
            min-height: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>チーム分け＆論題管理ツール</h1>

    <!-- ホーム画面 -->
    <div class="card" id="homeView">
        <h2>メニュー</h2>
        <p class="note">行いたい操作を選択してください。</p>
        <div class="home-menu">
            <button onclick="switchView('assignView')">チーム分け ＆ 論題選択ツール</button>
            <button class="btn-secondary" onclick="switchView('motionView')">新規論題追加ページ</button>
        </div>
    </div>

    <!-- 1. チーム分け＆論題選択セクション -->
    <div class="card hidden" id="assignView">
        <button class="back-btn" onclick="switchView('homeView')">← メニューに戻る</button>
        <h2>チーム分け ＆ 論題選択ツール</h2>
        
        <div class="grid-2">
            <div>
                <label for="participants">メンバー (1人入力するごとに改行してください)</label>
                <textarea id="participants" placeholder=""></textarea>
                <div class="note">※定員を超えた場合は自動的にジャッジに回ります</div>
            </div>
            <div>
                <label for="judges">ジャッジ (1人入力するごとに改行してください)</label>
                <textarea id="judges" placeholder=""></textarea>
            </div>
        </div>

        <div class="grid-2">
            <div>
                <label for="targetPairs">作成する試合数 (組)</label>
                <select id="targetPairs">
                    <option value="1" selected>1組 (2チーム)</option>
                    <option value="2">2組 (4チーム)</option>
                    <option value="3">3組 (6チーム)</option>
                    <option value="4">4組 (8チーム)</option>
                    <option value="5">5組 (10チーム)</option>
                    <option value="6">6組 (12チーム)</option>
                    <option value="7">7組 (14チーム)</option>
                    <option value="8">8組 (16チーム)</option>
                    <option value="9">9組 (18チーム)</option>
                    <option value="10">10組 (20チーム)</option>
                </select>
            </div>
            <div>
                <label for="membersPerTeam">1チームあたりの人数</label>
                <input type="number" id="membersPerTeam" value="3" min="1">
            </div>
        </div>

        <button onclick="generateAssignments()">チームを割り振る</button>

        <!-- 割り当て結果表示エリア -->
        <div id="resultCard" class="hidden" style="margin-top: 24px;">
            <h3 style="border-bottom: 2px solid #e2e8f0; padding-bottom: 6px;">結果</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <!-- 2. 新規論題追加セクション -->
    <div class="card hidden" id="motionView">
        <button class="back-btn" onclick="switchView('homeView')">← メニューに戻る</button>
        <h2>新規論題の追加（データベースへ保存）</h2>
        <p class="note">論題集データベースに論題を追加できます。部活内での論題を登録する際には、大会名の欄に「西暦/月/日(曜日) 部活内」のように登録して、年度のところにその時点での年度を書いてください。(例:2026/01/01(木)部活内)</p>
        
        <label for="newMotion">論題 (Motion) <span style="color:red;">*</span></label>
        <input type="text" id="newMotion" placeholder="This house would...">

        <div class="grid-2">
            <div>
                <label for="newTournament">大会名 (Tournament)</label>
                <input type="text" id="newTournament" placeholder="例: Asian Spring 2026">
            </div>
            <div>
                <label for="newYear">年度 (Year)</label>
                <input type="text" id="newYear" placeholder="例: 2026">
            </div>
        </div>

        <button class="btn-secondary" onclick="addNewMotion()">論題をデータベースに追加する</button>
        <div id="submitStatus"></div>
    </div>
</div>

<script>
    let motionsCache = [];

    window.addEventListener('DOMContentLoaded', async () => {
        // ローカルストレージから前回入力したデータを復元
        const savedParticipants = localStorage.getItem('debate_participants');
        const savedJudges = localStorage.getItem('debate_judges');
        if (savedParticipants) document.getElementById('participants').value = savedParticipants;
        if (savedJudges) document.getElementById('judges').value = savedJudges;

        try {
            const res = await fetch('motions.json');
            if (res.ok) {
                motionsCache = await res.json();
            }
        } catch (e) {
            console.error('論題集データベースの読み込みに失敗しました', e);
        }
    });

    function switchView(viewId) {
        document.getElementById('homeView').classList.add('hidden');
        document.getElementById('assignView').classList.add('hidden');
        document.getElementById('motionView').classList.add('hidden');

        document.getElementById(viewId).classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function generateAssignments() {
        const participantsText = document.getElementById('participants').value.trim();
        const judgesText = document.getElementById('judges').value.trim();
        const targetPairs = parseInt(document.getElementById('targetPairs').value) || 1;
        const membersPerTeam = parseInt(document.getElementById('membersPerTeam').value) || 3;

        if (!participantsText) {
            alert('参加者リストを入力してください。');
            return;
        }

        // 入力内容をデバイスに保存
        localStorage.setItem('debate_participants', participantsText);
        localStorage.setItem('debate_judges', judgesText);

        let participants = participantsText.split('\n').map(s => s.trim()).filter(s => s.length > 0);
        let judges = judgesText ? judgesText.split('\n').map(s => s.trim()).filter(s => s.length > 0) : [];

        const shuffle = (array) => {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        };

        shuffle(participants);
        shuffle(judges);

        const requiredTeams = targetPairs * 2;
        const totalCapacity = requiredTeams * membersPerTeam;
        let overflowNotice = "";

        if (participants.length > totalCapacity) {
            const extraCount = participants.length - totalCapacity;
            const extraParticipants = participants.splice(totalCapacity);
            judges = judges.concat(extraParticipants);
            overflowNotice = `<p style="color: #d97706; font-weight: bold; font-size: 0.9rem;">⚠️ 参加者が定員（${totalCapacity}人）より ${extraCount} 人多いため、あふれたメンバーを自動的にジャッジに割り振りました。</p>`;
        }

        let teams = [];
        for (let i = 0; i < requiredTeams; i++) {
            let members = participants.splice(0, membersPerTeam);
            if (members.length > 0) {
                teams.push({
                    name: `Team ${i + 1}`,
                    members: members
                });
            }
        }

        let html = overflowNotice;
        let matchCount = Math.floor(teams.length / 2);

        if (matchCount === 0) {
            html += `<p>チームを組むのに十分な参加者がいません（最低でも1組＝2チーム分の人数が必要です）。</p>`;
        } else {
            for (let i = 0; i < matchCount; i++) {
                const gov = teams[i * 2];
                const opp = teams[i * 2 + 1];
                const assignedJudge = judges.length > 0 ? judges.shift() : 'ジャッジ不足（追加してください）';

                html += `
                    <div class="result-box" id="match-box-${i}">
                        <strong>Match ${i + 1} (第 ${i + 1} 組)</strong><br>
                         <strong>Government:</strong> ${gov.members.join(', ')}<br>
                         <strong>Opposition:</strong> ${opp.members.join(', ')}<br>
                         <strong>Judge:</strong> <span style="color: #2563eb; font-weight: bold;">${assignedJudge}</span><br>
                         <strong>Motion:</strong> <span class="badge" id="selected-badge-${i}">未選択</span>
                        
                        <div class="motion-selection-area">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                                <label style="font-size: 0.85rem; margin-bottom: 0;">自動抽出された論題3件</label>
                                <button class="btn-secondary" style="padding: 4px 10px; font-size: 0.8rem; width: auto; min-height: auto;" onclick="redrawMotions(${i})">🔄 シャッフル</button>
                            </div>
                            <div id="candidates-container-${i}">
                                <!-- ここに動的に3件挿入されます -->
                            </div>

                            <label style="font-size: 0.85rem; margin-top: 12px; margin-bottom: 4px;">キーワード検索（データベース全体から探す）</label>
                            <input type="text" id="search-input-${i}" placeholder="キーワードを入力して検索..." oninput="filterMotions(${i})" style="margin-bottom: 6px; padding: 10px; font-size: 16px;">
                            
                            <div id="search-results-${i}"></div>
                        </div>
                    </div>
                `;
            }
        }

        if (judges.length > 0) {
            html += `<div style="margin-top: 20px;"><strong>その他のジャッジ:</strong> ${judges.join(', ')}</div>`;
        }

        document.getElementById('resultContent').innerHTML = html;
        document.getElementById('resultCard').classList.remove('hidden');

        // 各試合の初期ランダム3件を描画
        for (let i = 0; i < matchCount; i++) {
            redrawMotions(i);
        }
    }

    // 指定したMatchの論題3件を再抽選（シャッフル）する関数
    function redrawMotions(matchIndex) {
        const container = document.getElementById(`candidates-container-${matchIndex}`);
        if (!container) return;

        let sampleMotions = [];
        if (motionsCache.length > 0) {
            let shuffledMotions = [...motionsCache];
            for (let i = shuffledMotions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledMotions[i], shuffledMotions[j]] = [shuffledMotions[j], shuffledMotions[i]];
            }
            sampleMotions = shuffledMotions.slice(0, 3);
        }

        let candidatesHtml = '';
        if (sampleMotions.length > 0) {
            sampleMotions.forEach((m) => {
                const safeMotionText = m.motion.replace(/'/g, "\\'");
                candidatesHtml += `
                    <div class="motion-candidate-item">
                        <span>${m.motion} <span style="font-size:0.8rem; color:#64748b;">(${m.tournament || '大会名なし'}, ${m.year || '年度なし'})</span></span>
                        <button class="btn-secondary" onclick="selectThisMotion(${matchIndex}, '${safeMotionText}')">選択する</button>
                    </div>
                `;
            });
        } else {
            candidatesHtml = `<p style="font-size:0.85rem; color:#64748b;">登録されている論題がありません。「新規論題追加ページ」から追加してください。</p>`;
        }

        container.innerHTML = candidatesHtml;
    }

    // 論題を直接選択して決定する関数
    function selectThisMotion(matchIndex, motionText) {
        const badgeEl = document.getElementById(`selected-badge-${matchIndex}`);
        badgeEl.style.backgroundColor = '#2563eb';
        badgeEl.style.color = '#ffffff';
        badgeEl.innerText = motionText;
    }

    // キーワード検索による絞り込みとリスト表示
    function filterMotions(matchIndex) {
        const keyword = document.getElementById(`search-input-${matchIndex}`).value.toLowerCase();
        const resultsContainer = document.getElementById(`search-results-${matchIndex}`);

        if (!keyword) {
            resultsContainer.innerHTML = '';
            return;
        }

        const filtered = motionsCache.filter(m => {
            const text = (m.motion || '').toLowerCase();
            const tournament = (m.tournament || '').toLowerCase();
            const year = (m.year || '').toLowerCase();
            return text.includes(keyword) || tournament.includes(keyword) || year.includes(keyword);
        });

        if (filtered.length === 0) {
            resultsContainer.innerHTML = `<p style="font-size: 0.85rem; color: #dc2626;">一致する論題が見つかりませんでした。</p>`;
            return;
        }

        let resHtml = `<div style="max-height: 150px; overflow-y: auto; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px; background: #f8fafc;">`;
        filtered.forEach(m => {
            const safeText = m.motion.replace(/'/g, "\\'");
            resHtml += `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; gap: 8px;">
                    <span>${m.motion} (${m.tournament || '-'}, ${m.year || '-'})</span>
                    <button class="btn-secondary" style="padding: 4px 8px; font-size: 0.75rem; width: auto; min-height: auto;" onclick="selectThisMotion(${matchIndex}, '${safeText}')">選択</button>
                </div>
            `;
        });
        resHtml += `</div>`;
        resultsContainer.innerHTML = resHtml;
    }

    async function addNewMotion() {
        const motion = document.getElementById('newMotion').value.trim();
        const tournament = document.getElementById('newTournament').value.trim();
        const year = document.getElementById('newYear').value.trim();
        const statusEl = document.getElementById('submitStatus');

        if (!motion) {
            alert('論題を入力してください。');
            return;
        }

        statusEl.style.color = '#2563eb';
        statusEl.innerText = '追加中...';

        try {
            const res = await fetch('/api/add-motion', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ motion, tournament, year })
            });

            const data = await res.json();

            if (res.ok) {
                statusEl.style.color = '#16a34a';
                statusEl.innerText = '論題が正常に追加されました！';
                document.getElementById('newMotion').value = '';
                document.getElementById('newTournament').value = '';
                document.getElementById('newYear').value = '';

                const updateRes = await fetch('motions.json');
                if (updateRes.ok) motionsCache = await updateRes.json();
            } else {
                throw new Error(data.error || '追加に失敗しました。');
            }
        } catch (err) {
            statusEl.style.color = '#dc2626';
            statusEl.innerText = `エラー: ${err.message}`;
        }
    }
</script>

</body>
</html>
