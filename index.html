
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>チーム分け＆論題管理システム</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1e293b;background:#f8fafc}
*{box-sizing:border-box}
body{margin:0;padding:12px 14px 40px}
main{max-width:920px;margin:auto}
h1{font-size:1.5rem;color:#2563eb}
h2{font-size:1.2rem;margin-top:0}
h3{font-size:1.05rem;color:#2563eb}
.card{background:white;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 2px 10px #00000010}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{display:block;font-weight:600;margin:12px 0 5px}
input,textarea,select{width:100%;padding:11px;font:inherit;border:1px solid #cbd5e1;border-radius:8px;background:white}
textarea{min-height:120px;resize:vertical}
input[type=checkbox]{width:auto}
button{background:#2563eb;color:white;border:0;border-radius:8px;padding:11px 15px;min-height:44px;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#64748b}.danger{background:#dc2626}.success{background:#16a34a}
.small{font-size:.85rem;padding:7px 11px;min-height:36px}.full{width:100%}
.muted{font-size:.88rem;color:#64748b}
.item{padding:12px;border:1px solid #cbd5e1;border-radius:8px;margin:9px 0;overflow-wrap:anywhere}
.item-actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.panel{background:#f1f5f9;padding:14px;border-radius:9px}
.notice{padding:12px;margin-top:12px;border-radius:8px;background:#dbeafe;white-space:pre-wrap;overflow-wrap:anywhere}
.error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}
.scroll{max-height:400px;overflow-y:auto}
.match{padding:14px;border-left:4px solid #2563eb;background:#f1f5f9;margin:12px 0;border-radius:8px}
header{position:sticky;top:0;z-index:10;background:#f8fafc;padding:5px 0 10px}
.modal{position:fixed;inset:0;z-index:20;background:#0008;display:grid;place-items:center;padding:16px}
.dialog{background:white;border-radius:12px;padding:20px;width:min(100%,500px);max-height:90vh;overflow-y:auto}
@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:15px}}
</style>
</head>
<body>
<main>
<header>
  <div class="row" style="justify-content:space-between">
    <h1>チーム分け＆論題管理システム</h1>
    <div class="row">
      <span id="userLabel" class="muted"></span>
      <button id="logout" class="secondary small hidden" type="button">ログアウト</button>
      <button id="back" class="secondary small hidden" type="button">← メニュー</button>
    </div>
  </div>
  <div id="connection" class="muted">ログイン状態を確認中…</div>
</header>

<section id="auth" class="card hidden">
  <h2>ログイン</h2>
  <p class="muted">管理者から発行された個別ログインコードを入力してください。</p>
  <form id="loginForm">
    <label for="loginCode">ログインコード</label>
    <input id="loginCode" type="password" autocomplete="current-password"
      required maxlength="256" autocapitalize="none" spellcheck="false">
    <button id="loginButton" class="full" type="submit" style="margin-top:14px">ログイン</button>
  </form>
  <p class="muted">初回ログイン後は、セッションが有効な間、自動的にログインします。</p>
  <div id="authStatus" class="notice hidden" role="status" aria-live="polite"></div>
</section>

<section id="home" class="card hidden">
  <h2>メニュー</h2>
  <button id="goAssign" class="full" type="button">チーム分け ＆ 論題記録</button>
  <button id="goManage" class="secondary full" style="margin-top:12px" type="button">新規論題追加・管理</button>
</section>

<section id="assign" class="hidden">
  <div class="card">
    <h2>1. 論題の選択・実施記録</h2>
    <div class="row" style="justify-content:space-between">
      <span class="muted">ランダムに最大4件表示</span>
      <button id="shuffle" class="secondary small" type="button">シャッフル</button>
    </div>
    <div id="candidates"></div>
    <h3>論題を検索・絞り込み</h3>
    <input id="preSearch" type="search" placeholder="キーワード検索">
    <div class="grid">
      <select id="preTournament"><option value="">すべての大会</option></select>
      <select id="preYear"><option value="">すべての年度</option></select>
    </div>
    <select id="preStatus" style="margin-top:10px">
      <option value="all">すべての実施状況</option>
      <option value="done">直近1年に実施した論題</option>
      <option value="not_done">直近1年に未実施の論題</option>
    </select>
    <div id="preResults" class="scroll"></div>
    <div id="chosen" class="notice ok hidden">
      <div id="chosenText"></div>
      <button id="clearChosen" class="danger small" style="margin-top:8px" type="button">選択解除</button>
    </div>
  </div>
  <div class="card">
    <h2>2. メンバー・チーム設定</h2>
    <div class="grid">
      <div><label for="participants">メンバー（1行に1人）</label><textarea id="participants"></textarea></div>
      <div><label for="judges">事前指定ジャッジ</label><textarea id="judges"></textarea></div>
      <div><label for="pairs">試合数</label><select id="pairs"></select></div>
      <div><label for="teamSize">1チームの人数</label><input id="teamSize" type="number" min="1" max="30" value="3"></div>
    </div>
    <p class="muted">定員を超えたメンバーはジャッジ候補になります。</p>
    <button id="generate" class="full" type="button">チームを割り振る</button>
    <div id="assignResult"></div>
  </div>
</section>

<section id="manage" class="hidden">
  <div class="card">
    <h2 id="formHeading">新規論題の追加</h2>
    <div id="motionForm">
      <label for="motion">論題 *</label><input id="motion" placeholder="THW ...">
      <div class="grid">
        <div><label for="tournament">大会名</label><input id="tournament" placeholder="HPDU推奨"></div>
        <div><label for="year">年度</label><input id="year" placeholder="2026"></div>
      </div>
      <label><input id="done" type="checkbox"> 過去に実施したことがある</label>
      <div id="doneDateBox" class="hidden">
        <label for="doneDate">実施日（不明なら2024-01-01）</label><input id="doneDate" type="date">
      </div>
      <div class="row" style="margin-top:15px">
        <button id="preview" type="button">入力内容を確認する</button>
        <button id="cancelEdit" class="secondary hidden" type="button">編集をキャンセル</button>
      </div>
    </div>
    <div id="previewBox" class="panel hidden">
      <h3>登録内容の確認</h3><div id="previewText"></div>
      <div class="row">
        <button id="revise" class="secondary" type="button">修正する</button>
        <button id="save" class="success" type="button">この内容で決定する</button>
      </div>
    </div>
    <div id="formStatus" class="notice hidden" role="status"></div>
  </div>
  <div class="card">
    <h2>登録済み論題一覧</h2>
    <input id="manageSearch" type="search" placeholder="キーワード検索">
    <div class="grid">
      <select id="manageTournament"><option value="">すべての大会</option></select>
      <select id="manageYear"><option value="">すべての年度</option></select>
    </div>
    <select id="manageStatus" style="margin-top:10px">
      <option value="all">すべての実施状況</option>
      <option value="done">直近1年に実施</option>
      <option value="not_done">直近1年に未実施</option>
    </select>
    <div class="row" style="margin-top:12px">
      <button id="addTournament" class="secondary small" type="button">大会選択肢を追加</button>
      <button id="export" class="secondary small" type="button">JSONをダウンロード</button>
      <button id="reload" class="secondary small" type="button">再読み込み</button>
    </div>
    <div id="manageList" class="scroll"></div>
    <h3>削除済み論題</h3>
    <p class="muted">復元機能がAPI側で有効な場合、ここから復元できます。</p>
    <div id="deletedList" class="scroll"></div>
  </div>
</section>
</main>

<div id="confirmModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="dialog">
    <h2>論題実施の確認</h2>
    <p>次の論題を本日実施したものとして記録します。</p>
    <div id="confirmMotion" class="panel"></div>
    <div id="confirmError" class="notice error hidden"></div>
    <div class="row" style="margin-top:15px">
      <button id="closeModal" class="secondary" type="button">キャンセル</button>
      <button id="record" class="success" type="button">記録を確定する</button>
    </div>
  </div>
</div>

<script>
"use strict";
(() => {
  const $ = id => document.getElementById(id);
  const show = (id, visible) => $(id).classList.toggle("hidden", !visible);

  function element(tag, text, className = "") {
    const el = document.createElement(tag);
    if (text !== undefined) el.textContent = String(text);
    if (className) el.className = className;
    return el;
  }

  function makeButton(text, handler, className = "secondary small") {
    const btn = element("button", text, className);
    btn.type = "button";
    btn.addEventListener("click", handler);
    return btn;
  }

  function setMessage(id, text, type = "") {
    const el = $(id);
    el.textContent = text;
    el.className = "notice" + (type ? " " + type : "");
    show(id, Boolean(text));
  }

  let currentUser = null;
  let motions = [];
  let selectedMotion = null;
  let pendingId = null;
  let editingId = null;
  let busy = false;
  let customTournaments = [];

  function apiErrorMessage(body, fallback) {
    return body?.error || body?.message || fallback;
  }

  async function api(path, options = {}) {
    const response = await fetch(path, {
      credentials: "same-origin",
      ...options,
      headers: {
        ...(options.body ? { "Content-Type": "application/json" } : {}),
        ...(options.headers || {})
      }
    });
    const body = await response.json().catch(() => ({}));

    if (response.status === 401 && !path.startsWith("/api/auth-")) {
      currentUser = null;
      showAuth("セッションが切れました。もう一度ログインしてください。");
    }
    if (!response.ok) {
      throw new Error(apiErrorMessage(body, `APIエラー（${response.status}）`));
    }
    return body;
  }

  function historyOf(motion) {
    if (Array.isArray(motion.history)) {
      return motion.history.filter(v =>
        typeof v === "string" && !Number.isNaN(Date.parse(v))
      );
    }
    return [];
  }

  function recentHistory(motion) {
    const cutoff = new Date();
    cutoff.setFullYear(cutoff.getFullYear() - 1);
    const now = new Date();
    return historyOf(motion).filter(v => {
      const date = new Date(v);
      return date >= cutoff && date <= now;
    });
  }

  function normalizeTournament(value) {
    const t = String(value || "").trim();
    if (!t || t === "-") return "その他の大会";
    if (t.includes("部活")) return "部活内";
    if (t.toLowerCase().includes("sola cup")) return "SOLA CUP";
    if (t.includes("HEnDA")) return "HEnDA全国大会";
    if (t.includes("HPDU推奨")) return "HPDU推奨";
    if (/JWSDC|中学生全国大会|中学全国大会/.test(t)) return "JWSDC";
    if (/WSDC|世界交流大会/.test(t)) return "WSDC";
    if (t.includes("連盟杯")) return "HPDU連盟杯";
    if (/新緑杯|新芽杯/.test(t)) return "HPDU新緑杯・新芽杯";
    if (t.includes("合宿")) return "夏合宿";
    if (/PDA首都圏公立|首都圏公立|日比谷/.test(t)) return "PDA首都圏公立大会";
    if (/PDA全国大会|全国大会|冬全国大会/.test(t)) return "PDA全国大会";
    return t;
  }

  function changeView(view) {
    ["home", "assign", "manage"].forEach(id => show(id, id === view));
    show("back", view !== "home");
    if (view === "assign") renderCandidates();
    if (view === "manage") renderManagement();
    window.scrollTo(0, 0);
  }

  function showAuth(message = "") {
    currentUser = null;
    show("auth", true);
    show("home", false);
    show("assign", false);
    show("manage", false);
    show("back", false);
    show("logout", false);
    $("userLabel").textContent = "";
    $("connection").textContent = "ログインが必要です。";
    $("loginCode").value = "";
    setMessage("authStatus", message, message ? "error" : "");
  }

  function displayUser(user) {
    return user?.displayName || user?.name || user?.userId || user?.id || "ログイン中";
  }

  function showApp(user) {
    currentUser = user;
    show("auth", false);
    show("home", true);
    show("assign", false);
    show("manage", false);
    show("back", false);
    show("logout", true);
    $("userLabel").textContent = displayUser(user);
    $("connection").textContent = "論題データを読み込み中…";
    changeView("home");
    fetchMotions();
  }

  async function checkSession() {
    try {
      const result = await api("/api/auth-me");
      if (result.user) {
        showApp(result.user);
      } else {
        showAuth();
      }
    } catch (error) {
      showAuth("ログイン状態を確認できませんでした。API設定を確認してください。");
      console.error(error);
    }
  }

  async function login(event) {
    event.preventDefault();
    if (busy) return;

    const code = $("loginCode").value.trim();
    if (!code) {
      setMessage("authStatus", "ログインコードを入力してください。", "error");
      return;
    }

    busy = true;
    $("loginButton").disabled = true;
    setMessage("authStatus", "ログイン中…");

    try {
      const result = await api("/api/auth-login", {
        method: "POST",
        body: JSON.stringify({ code })
      });
      if (!result.user) throw new Error("ログイン情報を確認できませんでした。");
      $("loginCode").value = "";
      setMessage("authStatus", "");
      showApp(result.user);
    } catch (error) {
      setMessage("authStatus", error.message, "error");
    } finally {
      busy = false;
      $("loginButton").disabled = false;
    }
  }

  async function logout() {
    if (busy) return;
    $("logout").disabled = true;
    try {
      await api("/api/auth-logout", { method: "POST", body: "{}" });
    } catch (error) {
      console.error(error);
    } finally {
      $("logout").disabled = false;
      currentUser = null;
      motions = [];
      selectedMotion = null;
      closeRecordModal();
      showAuth("ログアウトしました。");
    }
  }

  function updateSelect(id, values, firstLabel) {
    const select = $(id);
    const previous = select.value;
    select.replaceChildren(new Option(firstLabel, ""));
    values.forEach(value => select.add(new Option(value, value)));
    select.value = values.includes(previous) ? previous : "";
  }

  function updateFilters() {
    const tournaments = [...new Set([
      ...motions.map(m => normalizeTournament(m.tournament)),
      ...customTournaments,
      "その他の大会"
    ])].sort((a, b) => a.localeCompare(b, "ja"));
    const years = [...new Set(motions.map(m => String(m.year || ""))
      .filter(y => y && y !== "-"))].sort((a, b) => b.localeCompare(a, "ja"));

    updateSelect("preTournament", tournaments, "すべての大会");
    updateSelect("manageTournament", tournaments, "すべての大会");
    updateSelect("preYear", years, "すべての年度");
    updateSelect("manageYear", years, "すべての年度");
  }

  function matchesKeywords(text, search) {
    const words = search.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const target = text.toLowerCase();
    return words.every(word => target.includes(word));
  }

  function filteredMotions(prefix) {
    const search = $(prefix + "Search").value;
    const tournament = $(prefix + "Tournament").value;
    const year = $(prefix + "Year").value;
    const status = $(prefix + "Status").value;

    return motions.filter(m => {
      if (m.is_deleted) return false;
      const norm = normalizeTournament(m.tournament);
      const y = String(m.year || "");
      if (!matchesKeywords([m.motion || "", norm, m.tournament || "", y].join(" "), search)) return false;
      if (tournament && norm !== tournament) return false;
      if (year && y !== year) return false;
      const done = recentHistory(m).length > 0;
      if (status === "done" && !done) return false;
      if (status === "not_done" && done) return false;
      return true;
    });
  }

  function motionItem(m, management = false) {
    const item = element("div", undefined, "item");
    item.append(
      element("strong", m.motion || "論題名なし"),
      element("div", `${normalizeTournament(m.tournament)} / ${m.year || "年度なし"}`, "muted")
    );

    if (management) {
      item.append(element("div", `直近1年の実施回数：${recentHistory(m).length}回`, "muted"));
      const actions = element("div", undefined, "item-actions");
      actions.append(
        makeButton("編集", () => startEdit(m.id)),
        makeButton("履歴", () => showHistory(m.id)),
        makeButton("削除", () => deleteMotion(m.id), "danger small")
      );
      item.append(actions);
    } else {
      item.append(makeButton("記録する", () => openRecordModal(m.id)));
    }
    return item;
  }

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function renderCandidates() {
    const container = $("candidates");
    container.replaceChildren();
    const candidates = shuffleArray(motions.filter(m => !m.is_deleted).slice()).slice(0, 4);
    if (!candidates.length) container.append(element("p", "論題がありません。", "muted"));
    candidates.forEach(m => container.append(motionItem(m)));
    renderPreSearch();
  }

  function renderPreSearch() {
    const container = $("preResults");
    container.replaceChildren();
    const active = $("preSearch").value.trim() ||
      $("preTournament").value || $("preYear").value ||
      $("preStatus").value !== "all";
    if (!active) return;

    const results = filteredMotions("pre");
    container.append(element("p", `${results.length}件ヒット`, "muted"));
    results.slice(0, 200).forEach(m => container.append(motionItem(m)));
    if (results.length > 200) container.append(element("p", "先頭200件を表示しています。", "muted"));
  }

  function renderManagement() {
    const container = $("manageList");
    const deletedContainer = $("deletedList");
    container.replaceChildren();
    deletedContainer.replaceChildren();

    const results = filteredMotions("manage");
    container.append(element("p",
      `${results.length}件 / 全${motions.filter(m => !m.is_deleted).length}件`, "muted"));
    results.slice(0, 300).forEach(m => container.append(motionItem(m, true)));
    if (results.length > 300) container.append(element("p", "先頭300件を表示しています。", "muted"));

    const deleted = motions.filter(m => m.is_deleted);
    deletedContainer.append(element("p", `${deleted.length}件`, "muted"));
    deleted.slice(0, 200).forEach(m => {
      const item = element("div", undefined, "item");
      item.append(
        element("strong", m.motion || "論題名なし"),
        element("div", `${normalizeTournament(m.tournament)} / ${m.year || "年度なし"}`, "muted"),
        makeButton("復元", () => restoreMotion(m.id), "success small")
      );
      deletedContainer.append(item);
    });
  }

  async function fetchMotions() {
    if (!currentUser) return;
    $("connection").textContent = "論題データを読み込み中…";
    try {
      const result = await api("/api/motion-list");
      motions = Array.isArray(result.motions) ? result.motions : [];
      $("connection").textContent = `ログイン中：${displayUser(currentUser)} ・ 論題${motions.length}件`;
      updateFilters();
      renderCandidates();
      renderManagement();
    } catch (error) {
      $("connection").textContent = "データ取得エラー：" + error.message;
      console.error(error);
    }
  }

  function openRecordModal(id) {
    const m = motions.find(x => String(x.id) === String(id));
    if (!m) return;
    pendingId = m.id;
    $("confirmMotion").textContent = m.motion;
    setMessage("confirmError", "");
    show("confirmModal", true);
  }

  function closeRecordModal() {
    pendingId = null;
    show("confirmModal", false);
  }

  async function recordMotion() {
    if (busy || pendingId === null) return;
    const id = pendingId;
    busy = true;
    $("record").disabled = true;
    try {
      await api("/api/motion-record", { method: "POST", body: JSON.stringify({ id }) });
      const m = motions.find(x => String(x.id) === String(id));
      if (m) {
        selectedMotion = m.motion;
        $("chosenText").textContent = "記録済み：" + selectedMotion;
        show("chosen", true);
      }
      closeRecordModal();
      await fetchMotions();
    } catch (error) {
      setMessage("confirmError", "記録に失敗しました：" + error.message, "error");
    } finally {
      busy = false;
      $("record").disabled = false;
    }
  }

  async function showHistory(id) {
    try {
      const result = await api(`/api/motion-history?id=${encodeURIComponent(id)}`);
      const history = Array.isArray(result.history) ? result.history : [];
      const lines = history.map(h => {
        if (typeof h === "string") return h;
        const date = h.changed_at || h.created_at || h.date || "";
        const action = h.action || h.operation || "変更";
        return `${date} — ${action}`;
      });
      alert(lines.length ? lines.join("\n") : "履歴はありません。");
    } catch (error) {
      alert("履歴取得エラー：" + error.message);
    }
  }

  function resetForm() {
    editingId = null;
    ["motion", "tournament", "year", "doneDate"].forEach(id => $(id).value = "");
    $("done").checked = false;
    show("doneDateBox", false);
    show("cancelEdit", false);
    show("motionForm", true);
    show("previewBox", false);
    $("formHeading").textContent = "新規論題の追加";
  }

  function startEdit(id) {
    const m = motions.find(x => String(x.id) === String(id));
    if (!m) return;
    editingId = m.id;
    $("motion").value = m.motion || "";
    $("tournament").value = m.tournament === "-" ? "" : m.tournament || "";
    $("year").value = m.year === "-" ? "" : m.year || "";

    const history = historyOf(m).sort((a, b) => Date.parse(b) - Date.parse(a));
    $("done").checked = history.length > 0;
    show("doneDateBox", history.length > 0);
    $("doneDate").value = history.length ? new Date(history[0]).toISOString().slice(0, 10) : "";

    $("formHeading").textContent = "論題の編集";
    show("cancelEdit", true);
    show("motionForm", true);
    show("previewBox", false);
    setMessage("formStatus", "");
    window.scrollTo(0, 0);
  }

  function formData() {
    return {
      motion: $("motion").value.trim(),
      tournament: $("tournament").value.trim(),
      year: $("year").value.trim(),
      done: $("done").checked,
      date: $("doneDate").value || "2024-01-01"
    };
  }

  function previewMotion() {
    const v = formData();
    if (!v.motion) {
      setMessage("formStatus", "論題を入力してください。", "error");
      return;
    }
    const duplicate = motions.find(m =>
      !m.is_deleted &&
      String(m.id) !== String(editingId) &&
      (m.motion || "").trim().toLowerCase() === v.motion.toLowerCase() &&
      (m.tournament || "").trim().toLowerCase() === v.tournament.toLowerCase() &&
      String(m.year || "").trim().toLowerCase() === v.year.toLowerCase()
    );
    if (duplicate) {
      setMessage("formStatus", "同一の論題・大会名・年度のデータが存在します。", "error");
      return;
    }

    setMessage("formStatus", "");
    const container = $("previewText");
    container.replaceChildren();
    [
      ["論題", v.motion],
      ["大会名", v.tournament || "未入力"],
      ["年度", v.year || "未入力"],
      ["実施状況", v.done ? `実施済み（${v.date}）` : "未実施"]
    ].forEach(([label, value]) => {
      const p = element("p");
      p.append(element("strong", label + "："), element("span", value));
      container.append(p);
    });
    show("motionForm", false);
    show("previewBox", true);
  }

  async function saveMotion() {
    if (busy) return;
    const v = formData();
    if (!v.motion) {
      setMessage("formStatus", "論題を入力してください。", "error");
      return;
    }
    busy = true;
    $("save").disabled = true;
    try {
      await api("/api/motion-write", {
        method: "POST",
        body: JSON.stringify({
          action: editingId === null ? "create" : "update",
          id: editingId,
          motion: v.motion,
          tournament: v.tournament || "-",
          year: v.year || "-",
          done: v.done,
          date: v.done ? v.date : null
        })
      });
      resetForm();
      setMessage("formStatus", "保存しました。", "ok");
      await fetchMotions();
    } catch (error) {
      setMessage("formStatus", "保存に失敗しました：" + error.message, "error");
    } finally {
      busy = false;
      $("save").disabled = false;
    }
  }

  async function deleteMotion(id) {
    const m = motions.find(x => String(x.id) === String(id));
    if (!m || busy || !confirm(`「${m.motion}」を削除しますか？`)) return;
    busy = true;
    try {
      await api("/api/motion-write", {
        method: "POST",
        body: JSON.stringify({ action: "delete", id })
      });
      setMessage("formStatus", "削除しました。", "ok");
      await fetchMotions();
    } catch (error) {
      setMessage("formStatus", "削除に失敗しました：" + error.message, "error");
    } finally {
      busy = false;
    }
  }

  async function restoreMotion(id) {
    if (busy || !confirm("この論題を復元しますか？")) return;
    busy = true;
    try {
      await api("/api/motion-restore", { method: "POST", body: JSON.stringify({ id }) });
      setMessage("formStatus", "復元しました。", "ok");
      await fetchMotions();
    } catch (error) {
      setMessage("formStatus", "復元に失敗しました：" + error.message, "error");
    } finally {
      busy = false;
    }
  }

  function generateAssignments() {
    const participants = $("participants").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const judges = $("judges").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const pairs = Number($("pairs").value);
    const size = Number($("teamSize").value);
    const result = $("assignResult");
    result.replaceChildren();

    if (!Number.isInteger(size) || size < 1 || size > 30) {
      result.append(element("div", "チーム人数は1～30で指定してください。", "notice error"));
      return;
    }
    if (!participants.length) {
      result.append(element("div", "参加者を入力してください。", "notice error"));
      return;
    }
    try {
      localStorage.setItem("debate_participants", $("participants").value);
      localStorage.setItem("debate_judges", $("judges").value);
    } catch (error) { console.warn(error); }

    shuffleArray(participants);
    shuffleArray(judges);
    const capacity = pairs * 2 * size;
    const overflow = participants.splice(capacity);
    judges.push(...overflow);
    if (overflow.length) result.append(element("p", `定員超過の${overflow.length}人をジャッジ候補にしました。`, "notice"));

    const completePairs = Math.min(pairs, Math.floor(participants.length / (size * 2)));
    if (!completePairs) {
      result.append(element("div", `最低${size * 2}人必要です。`, "notice error"));
      return;
    }
    const teams = [];
    for (let i = 0; i < completePairs * 2; i++) teams.push(participants.splice(0, size));

    for (let i = 0; i < completePairs; i++) {
      const match = element("div", undefined, "match");
      match.append(element("strong", `Match ${i + 1}`));
      [
        ["Government", teams[i * 2].join("、")],
        ["Opposition", teams[i * 2 + 1].join("、")],
        ["Judge", judges.shift() || "未割り当て"],
        ["Motion", selectedMotion || "未選択"]
      ].forEach(([label, value]) => {
        const p = element("p");
        p.append(element("strong", label + "："), element("span", value));
        match.append(p);
      });
      result.append(match);
    }
    if (participants.length) result.append(element("p", "未割り当ての参加者：" + participants.join("、"), "muted"));
    if (judges.length) result.append(element("p", "その他のジャッジ：" + judges.join("、"), "muted"));
  }

  function downloadJSON() {
    const blob = new Blob([JSON.stringify(motions, null, 2)], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "motions.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }

  function bindEvents() {
    for (let i = 1; i <= 10; i++) $("pairs").add(new Option(`${i}組（${i * 2}チーム）`, String(i)));

    $("loginForm").addEventListener("submit", login);
    $("logout").addEventListener("click", logout);

    $("goAssign").addEventListener("click", () => changeView("assign"));
    $("goManage").addEventListener("click", () => changeView("manage"));
    $("back").addEventListener("click", () => changeView("home"));
    $("shuffle").addEventListener("click", renderCandidates);
    $("generate").addEventListener("click", generateAssignments);
    $("clearChosen").addEventListener("click", () => {
      selectedMotion = null;
      show("chosen", false);
    });

    $("closeModal").addEventListener("click", closeRecordModal);
    $("record").addEventListener("click", recordMotion);
    $("done").addEventListener("change", () => show("doneDateBox", $("done").checked));
    $("preview").addEventListener("click", previewMotion);
    $("revise").addEventListener("click", () => {
      show("previewBox", false);
      show("motionForm", true);
    });
    $("save").addEventListener("click", saveMotion);
    $("cancelEdit").addEventListener("click", () => {
      resetForm();
      setMessage("formStatus", "");
    });
    $("export").addEventListener("click", downloadJSON);
    $("reload").addEventListener("click", fetchMotions);

    $("addTournament").addEventListener("click", () => {
      const name = prompt("追加する大会名を入力してください。");
      if (name && name.trim()) {
        customTournaments.push(name.trim());
        updateFilters();
      }
    });

    ["pre", "manage"].forEach(prefix => {
      ["Search", "Tournament", "Year", "Status"].forEach(suffix => {
        $(prefix + suffix).addEventListener(
          suffix === "Search" ? "input" : "change",
          prefix === "pre" ? renderPreSearch : renderManagement
        );
      });
    });

    try {
      $("participants").value = localStorage.getItem("debate_participants") || "";
      $("judges").value = localStorage.getItem("debate_judges") || "";
    } catch (error) { console.warn(error); }
  }

  bindEvents();
  checkSession();
})();
</script>
</body>
</html>
