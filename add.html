<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ディベート論題 追加フォーム</title>
  <style>
    body{font:16px system-ui;background:#f4f6f9;color:#333;max-width:600px;margin:40px auto;padding:20px}
    main{background:white;padding:25px;border-radius:12px}
    label{display:block;margin:12px 0 5px;font-weight:bold}
    input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}
    button{margin-top:16px;background:#1a73e8;color:white;border:0;padding:12px 20px;border-radius:6px;cursor:pointer}
    #message{margin-top:15px;white-space:pre-wrap}
  </style>
</head>
<body>
  <main>
    <h1>論題追加フォーム</h1>
    <p>開発版。管理者APIトークンは通信時のみ使用し、保存しません。</p>
    <label for="adminToken">管理者APIトークン</label>
    <input id="adminToken" type="password" autocomplete="off">
    <label for="motion">論題</label>
    <input id="motion" required maxlength="2000" placeholder="This house would...">
    <label for="tournament">大会名</label>
    <input id="tournament" maxlength="300">
    <label for="year">年度</label>
    <input id="year" maxlength="20">
    <button id="submit">論題を追加する</button>
    <p id="message" role="status"></p>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    $('submit').addEventListener('click', async () => {
      const button = $('submit');
      const message = $('message');
      const token = $('adminToken').value;
      const motion = $('motion').value.trim();
      if (!token || !motion) {
        message.textContent = '管理者トークンと論題を入力してください。';
        return;
      }

      button.disabled = true;
      message.textContent = '保存中…';
      try {
        const response = await fetch('/api/motion-write', {
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            action: 'insert',
            row: {
              motion,
              tournament: $('tournament').value.trim(),
              year: $('year').value.trim(),
              history: []
            }
          })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(result.error === 'DUPLICATE_MOTION'
            ? '同一の論題が既に登録されています。'
            : result.error || '保存に失敗しました。');
        }
        $('motion').value = '';
        message.textContent = '論題を追加し、監査履歴に記録しました。';
      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
