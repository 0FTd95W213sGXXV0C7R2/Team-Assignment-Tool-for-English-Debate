<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>論題履歴・復元（開発版）</title><style>body{font:16px system-ui;max-width:780px;margin:30px auto;padding:0 15px;background:#f7f9fc;color:#172033}input,button{padding:12px;margin:5px 0;border-radius:7px;border:1px solid #bac5d5}input{width:100%;box-sizing:border-box}button{cursor:pointer;background:#235ad5;color:white}article{background:white;border:1px solid #d5dce7;padding:14px;margin:10px 0;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#status{white-space:pre-wrap}</style></head><body><h1>論題の変更履歴・復元</h1><p>開発版。管理者トークンはこの画面のメモリ内だけで保持し、保存しません。</p><label>管理者APIトークン<input id="token" type="password" autocomplete="off"></label><label>論題ID<input id="id" placeholder="UUID"></label><button id="load">履歴を取得</button><p id="status" role="status"></p><div id="results"></div><script>
const $=id=>document.getElementById(id);let token='';
async function api(url,options={}){token=$('token').value;const r=await fetch(url,{...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...options.headers},cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data;}
$('load').onclick=async()=>{const id=$('id').value.trim();$('results').replaceChildren();$('status').textContent='取得中…';try{const data=await api('/api/motion-history?id='+encodeURIComponent(id));$('status').textContent=data.rows.length+'件';for(const row of data.rows){const article=document.createElement('article');const title=document.createElement('h3');title.textContent='#'+row.audit_id+' '+row.action+' '+row.changed_at;article.append(title);const pre=document.createElement('pre');pre.textContent=JSON.stringify({before:row.before_data,after:row.after_data},null,2);article.append(pre);if(row.before_data){const button=document.createElement('button');button.textContent='この変更の直前へ復元';button.onclick=async()=>{const raw=prompt('現在のrevision番号を入力してください（test環境のmotionsテーブルで確認）');if(raw===null)return;const revision=Number(raw);if(!Number.isSafeInteger(revision)||revision<0){alert('revisionが不正です');return;}if(!confirm('test環境の論題を復元します。よろしいですか？'))return;try{const result=await api('/api/motion-restore',{method:'POST',body:JSON.stringify({id,auditId:row.audit_id,expectedRevision:revision})});alert('復元完了。新revision: '+result.restored.revision);$('load').click();}catch(e){alert(e.message);}};article.append(button);} $('results').append(article);}}catch(e){$('status').textContent=e.message;}};
</script></body></html>
